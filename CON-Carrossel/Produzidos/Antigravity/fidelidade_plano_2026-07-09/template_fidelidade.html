<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidelidade ao Plano — Gustavo Lima</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 30px 20px; }
        h1 { text-align: center; font-size: 22px; color: #fff; margin-bottom: 6px; }
        .page-subtitle { text-align: center; color: #777; font-size: 13px; margin-bottom: 30px; }
        .btn-container { text-align: center; margin: 0 0 30px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { border: none; padding: 14px 36px; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-family: 'Montserrat', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
        .btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #444; }
        .status { text-align: center; color: #3b82f6; margin: 10px 0 20px; font-size: 13px; font-weight: bold; min-height: 20px; }
        .slides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; max-width: 1400px; margin: 0 auto; }
        .slide-wrapper { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a2a; transition: all 0.2s; display: flex; flex-direction: column; }
        .slide-wrapper:hover { border-color: #3b82f6; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .slide-scaler { width: 100%; aspect-ratio: 1080 / 1350; overflow: hidden; position: relative; }
        .slide-label { padding: 8px 10px 4px; font-size: 12px; color: #777; text-align: center; background: #151515; font-weight: bold; }
        .slide-footer { display: flex; justify-content: center; padding: 6px 10px 10px; background: #151515; }
        .btn-download { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; border: none; padding: 8px 20px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: 'Montserrat', sans-serif; width: 100%; }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .legenda-box { background: #111; padding: 12px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        .legenda-textarea { width: 100%; height: 110px; background: #000; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 10px; font-size: 12px; font-family: 'Segoe UI', sans-serif; resize: vertical; line-height: 1.5; }
        .btn-copy-legenda { background: #222; color: #bbb; border: 1px solid #444; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: 600; transition: all 0.2s; }
        .btn-copy-legenda:hover { background: #333; color: #fff; }

        /* ===================== SLIDES ===================== */
        .slide {
            width: 1080px; height: 1350px;
            background: linear-gradient(160deg, #0B1D3A 0%, #0F2444 50%, #091830 100%);
            display: flex; flex-direction: column; justify-content: center;
            padding: 100px 90px; position: relative;
            font-family: 'Montserrat', sans-serif; transform-origin: top left;
            overflow: hidden;
        }
        /* Variações de fundo */
        .slide.bg-sand  { background: #F0EBE3; color: #0B1D3A; }
        .slide.bg-warm  { background: #1A0F0A; color: #fff; } /* quase preto quente */
        .slide.bg-navy  { background: linear-gradient(160deg, #0B1D3A 0%, #0F2444 50%, #091830 100%); }

        /* Seta de navegação */
        .slide .arrow { position: absolute; bottom: 75px; right: 75px; display: flex; align-items: center; z-index: 10; }
        .slide .arrow-line { width: 110px; height: 2px; background: rgba(255,255,255,0.3); }
        .slide .arrow-head { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 13px solid rgba(255,255,255,0.3); }
        .slide.bg-sand .arrow-line { background: rgba(11,29,58,0.3); }
        .slide.bg-sand .arrow-head { border-left-color: rgba(11,29,58,0.3); }
        .slide.bg-warm .arrow-line { background: rgba(255,255,255,0.2); }
        .slide.bg-warm .arrow-head { border-left-color: rgba(255,255,255,0.2); }

        /* Destaques */
        .hl-gold  { background: rgba(234,179,8,0.28); color: #fff !important; padding: 5px 18px; border-radius: 8px; display: inline-block; }
        .hl-sand  { background: rgba(11,29,58,0.12); color: #0B1D3A !important; padding: 5px 18px; border-radius: 8px; display: inline-block; }
        .hl-green { background: rgba(34,197,94,0.2); color: #fff !important; padding: 5px 18px; border-radius: 8px; display: inline-block; }

        /* ── LINHA PONTILHADA ── separador entre bullet points */
        .dot-item {
            display: flex; align-items: flex-start; gap: 24px;
            padding: 28px 0;
            border-bottom: 2px dashed rgba(11,29,58,0.18);
        }
        .dot-item:last-child { border-bottom: none; }
        .dot-item.dark { border-bottom-color: rgba(255,255,255,0.12); }
        .dot-icon { font-size: 40px; flex-shrink: 0; margin-top: 4px; }
        .dot-text { font-size: 37px; line-height: 1.45; }

        #renderArea { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>
    <h1>📋 Carrossel: Você não precisa ser fiel ao plano</h1>
    <p class="page-subtitle">Quebra de Crença: Gustavo Lima (JCLUZ)</p>
    <div class="btn-container">
        <button class="btn btn-primary" onclick="downloadAllPNGs()">📦 Baixar TODOS os PNGs</button>
        <button class="btn btn-secondary" onclick="downloadPDF()">📄 Baixar PDF completo</button>
    </div>
    <div class="status" id="status"></div>
    <div class="slides-grid" id="slidesGrid"></div>
    <div id="renderArea"></div>

    <script>
    const SLIDES_HTML = [

        // ── SLIDE 1 — Capa (foto: casal no jantar) ──────────────────────────
        `<div style="position:absolute;inset:0;background-image:url('COVER_B64_HERE');background-size:cover;background-position:center top;z-index:1;"></div>
         <div style="position:absolute;bottom:0;left:0;width:100%;height:58%;background:linear-gradient(to top,rgba(9,24,48,1) 0%,rgba(9,24,48,0.94) 40%,rgba(9,24,48,0.4) 70%,transparent 100%);z-index:2;"></div>
         <div style="position:absolute;bottom:0;left:0;width:100%;padding:0 90px 95px;z-index:3;text-align:center;">
             <div style="font-size:64px;font-weight:900;color:#fff;line-height:1.1;letter-spacing:-1.5px;text-transform:uppercase;text-shadow:2px 4px 20px rgba(0,0,0,0.8);">VOCÊ NÃO PRECISA<br>SER FIEL AO PLANO.</div>
             <div style="height:18px;"></div>
             <div style="font-size:35px;color:rgba(255,255,255,0.65);font-weight:400;">Tempo de casa não é virtude. É custo.</div>
         </div>`,

        // ── SLIDE 2 — Statement puro (BEGE — tipografia grande, sem caixas) ──
        `<div style="position:absolute;inset:0;background:#F0EBE3;z-index:-1;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;width:100%;height:100%;">
             <div style="font-size:36px;font-weight:400;color:rgba(11,29,58,0.45);text-transform:uppercase;letter-spacing:4px;margin-bottom:32px;">A realidade</div>
             <div style="font-size:72px;font-weight:900;color:#0B1D3A;line-height:1.08;letter-spacing:-2px;margin-bottom:48px;">Você está em um<br><em style="font-style:italic;color:#0B1D3A;">relacionamento</em><br>com o seu plano<br>de saúde.</div>
             <div style="width:80px;height:5px;background:#0B1D3A;border-radius:3px;margin-bottom:40px;"></div>
             <div style="font-size:40px;font-weight:400;color:rgba(11,29,58,0.7);line-height:1.55;">E como todo relacionamento,<br>ele precisa <span class="hl-sand" style="font-weight:900;">fazer sentido</span><br>para a sua vida hoje.</div>
         </div>`,

        // ── SLIDE 3: Ironia / O que a operadora não faz (NAVY + timeline pontilhada) ────
        `<div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;width:100%;">
             <div style="font-size:36px;font-weight:400;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:3px;margin-bottom:30px;">Mas atenção...</div>
             <div style="font-size:68px;font-weight:900;color:#fff;line-height:1.15;margin-bottom:60px;letter-spacing:-1px;">A operadora não é fiel<br><span class="hl-gold">a você.</span></div>
             <!-- Timeline com linha vertical pontilhada linkando os itens -->
             <div style="position:relative;width:100%;">
                 <div style="position:absolute;left:21px;top:44px;height:calc(100% - 88px);border-left:3px dashed rgba(255,255,255,0.22);z-index:0;"></div>
                 <div style="display:flex;align-items:center;gap:32px;padding:16px 0 40px;position:relative;">
                     <div style="width:44px;height:44px;border-radius:50%;background:#EAB308;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:1;">📈</div>
                     <div style="font-size:37px;font-weight:400;color:rgba(255,255,255,0.88);line-height:1.4;">Reajusta a mensalidade <strong style="color:#fff;">sem pedir licença</strong></div>
                 </div>
                 <div style="display:flex;align-items:center;gap:32px;padding:16px 0 40px;position:relative;">
                     <div style="width:44px;height:44px;border-radius:50%;background:#EAB308;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:1;">🏥</div>
                     <div style="font-size:37px;font-weight:400;color:rgba(255,255,255,0.88);line-height:1.4;">Descredencia hospitais <strong style="color:#fff;">sem te avisar</strong></div>
                 </div>
                 <div style="display:flex;align-items:center;gap:32px;padding:16px 0;position:relative;">
                     <div style="width:44px;height:44px;border-radius:50%;background:#EAB308;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:1;">📋</div>
                     <div style="font-size:37px;font-weight:400;color:rgba(255,255,255,0.88);line-height:1.4;">Muda regras de coparticipação <strong style="color:#fff;">no silêncio</strong></div>
                 </div>
             </div>
         </div>`,

        // ── SLIDE 4 — Split: O que você pensa vs O que acontece (BEGE) ──────
        `<div style="position:absolute;inset:0;background:#F0EBE3;z-index:-1;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;width:100%;height:100%;justify-content:center;">
             <div style="font-size:42px;font-weight:900;color:#0B1D3A;text-transform:uppercase;letter-spacing:-0.5px;margin-bottom:48px;"><span class="hl-sand">Tempo de casa</span> não garante:</div>
             <div style="display:flex;gap:0;width:100%;">
                 <!-- Coluna esquerda: o que você pensa -->
                 <div style="flex:1;padding-right:36px;border-right:2px dashed rgba(11,29,58,0.2);">
                     <div style="font-size:26px;font-weight:700;color:rgba(11,29,58,0.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:28px;">Você acredita</div>
                     <div style="font-size:34px;font-weight:400;color:rgba(11,29,58,0.7);line-height:1.55;border-bottom:2px dashed rgba(11,29,58,0.12);padding-bottom:24px;margin-bottom:24px;">"Com o tempo, o reajuste vai ser menor"</div>
                     <div style="font-size:34px;font-weight:400;color:rgba(11,29,58,0.7);line-height:1.55;border-bottom:2px dashed rgba(11,29,58,0.12);padding-bottom:24px;margin-bottom:24px;">"A rede só tende a melhorar"</div>
                     <div style="font-size:34px;font-weight:400;color:rgba(11,29,58,0.7);line-height:1.55;">"Leal quem ficou vai ser recompensado"</div>
                 </div>
                 <!-- Coluna direita: a realidade -->
                 <div style="flex:1;padding-left:36px;">
                     <div style="font-size:26px;font-weight:700;color:#EF4444;text-transform:uppercase;letter-spacing:2px;margin-bottom:28px;">A realidade</div>
                     <div style="font-size:34px;font-weight:700;color:#0B1D3A;line-height:1.55;border-bottom:2px dashed rgba(11,29,58,0.12);padding-bottom:24px;margin-bottom:24px;">O reajuste segue a ANS. Não o seu tempo de casa.</div>
                     <div style="font-size:34px;font-weight:700;color:#0B1D3A;line-height:1.55;border-bottom:2px dashed rgba(11,29,58,0.12);padding-bottom:24px;margin-bottom:24px;">Redes mudam conforme a rentabilidade da operadora.</div>
                     <div style="font-size:34px;font-weight:700;color:#0B1D3A;line-height:1.55;">Fidelidade não está no contrato.</div>
                 </div>
             </div>
         </div>`,

        // ── SLIDE 5 — A pergunta que muda tudo (ESCURO — tipografia pura) ───
        `<div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;text-align:center;">
             <div style="font-size:32px;font-weight:400;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:4px;margin-bottom:44px;">A pergunta que muda tudo</div>
             <div style="font-size:32px;font-weight:400;color:rgba(255,255,255,0.5);line-height:1.5;">Não é:</div>
             <div style="height:16px;"></div>
             <div style="font-size:46px;font-weight:700;color:rgba(255,255,255,0.5);font-style:italic;line-height:1.3;text-decoration:line-through;margin-bottom:44px;">"Há quantos anos estou<br>neste plano?"</div>
             <div style="width:100px;height:3px;background:rgba(255,255,255,0.15);margin-bottom:44px;"></div>
             <div style="font-size:32px;font-weight:400;color:rgba(255,255,255,0.6);line-height:1.5;">É:</div>
             <div style="height:16px;"></div>
             <div class="hl-gold" style="font-size:52px;font-weight:900;line-height:1.25;padding:18px 32px;border-radius:16px;">"Esse plano ainda faz sentido<br>pra minha empresa hoje?"</div>
         </div>`,

        // ── SLIDE 6: Checklist com linha pontilhada (BEGE / Salvável) ──────
        `<div style="position:absolute;inset:0;background:#F0EBE3;z-index:-1;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;width:100%;height:100%;justify-content:flex-start;">
             <div style="font-size:42px;font-weight:900;color:#0B1D3A;letter-spacing:-0.5px;margin-bottom:8px;">HORA DE REVISAR?</div>
             <div style="font-size:30px;font-weight:400;color:rgba(11,29,58,0.45);margin-bottom:44px;">Marque o que aconteceu com você:</div>
             <div style="width:100%;background:#fff;border-radius:20px;padding:20px 44px;box-shadow:0 12px 40px rgba(0,0,0,0.07);margin-bottom:50px;">
                     <div class="dot-item">
                         <div class="dot-icon">📈</div>
                         <div class="dot-text" style="color:rgba(11,29,58,0.85);">Reajuste acima de <strong style="color:#0B1D3A;">15%</strong> no último ano</div>
                     </div>
                     <div class="dot-item">
                         <div class="dot-icon">🏥</div>
                         <div class="dot-text" style="color:rgba(11,29,58,0.85);">Hospital ou médico que você usa foi descredenciado</div>
                     </div>
                     <div class="dot-item">
                         <div class="dot-icon">👥</div>
                         <div class="dot-text" style="color:rgba(11,29,58,0.85);">A equipe cresceu ou o perfil de uso mudou</div>
                     </div>
                     <div class="dot-item">
                         <div class="dot-icon">💰</div>
                         <div class="dot-text" style="color:rgba(11,29,58,0.85);">Mensalidade alta, uso baixo: sem contrapartida real</div>
                     </div>
                 </div>
             <div style="background:#0B1D3A;border-radius:16px;padding:28px 36px;text-align:center;">
                 <div style="font-size:34px;font-weight:700;color:#fff;">Se marcou pelo menos um, vale revisar. 🎯</div>
             </div>
         </div>`,

        // ── SLIDE 7 — CTA (ESCURO) ───────────────────────────────────────────
        `<div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;height:100%;justify-content:center;">
             <div style="font-size:28px;font-weight:400;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:4px;margin-bottom:36px;">Conclusão</div>
             <div style="font-size:68px;font-weight:900;color:#fff;line-height:1.1;letter-spacing:-2px;text-transform:uppercase;">TROCAR DE PLANO<br>NÃO É FRAQUEZA.</div>
             <div style="height:24px;"></div>
             <div class="hl-gold" style="font-size:54px;font-weight:900;padding:14px 36px;border-radius:14px;">É gestão.</div>
             <div style="height:50px;"></div>
             <div style="width:120px;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;margin-bottom:50px;"></div>
             <div style="font-size:38px;font-weight:400;color:rgba(255,255,255,0.65);line-height:1.7;max-width:820px;">O empresário que revisa o plano todo ano <strong style="color:#fff;">gasta menos, oferece mais</strong> e protege melhor o time.</div>
             <div style="height:50px;"></div>
             <div style="font-size:34px;font-weight:400;color:rgba(255,255,255,0.4);line-height:1.6;">Manda pra aquele empresário que renova<br>automaticamente sem questionar.</div>
             <div style="height:44px;"></div>
             <div style="font-size:50px;font-weight:900;color:#60a5fa;">Bora, pra cima! 🚀💪</div>
         </div>`
    ];

    const LABELS = [
        'Slide 1: Capa (Casal no Jantar)',
        'Slide 2: Statement Tipográfico (Bege)',
        'Slide 3: A Operadora Não É Fiel (Escuro Quente)',
        'Slide 4: Split (Crença vs Realidade)',
        'Slide 5: A Pergunta que Muda Tudo',
        'Slide 6: Checklist Linha Pontilhada',
        'Slide 7: CTA Compartilhamento'
    ];

    const LEGENDAS = [
        'Você tem o mesmo plano de saúde há anos e nunca questionou?\n\nIsso pode estar custando mais do que parece. Desliza.',
        'É um relacionamento. E como todo relacionamento, ele precisa fazer sentido pra sua vida hoje — não pra quem você era quando assinou.',
        'Enquanto você é fiel, a operadora reajusta sem pedir licença, descredencia hospital sem te avisar e muda coparticipação no silêncio.',
        'Tempo de casa não garante reajuste menor, rede melhor nem atendimento mais rápido. Isso não está em contrato nenhum.',
        'Pare de perguntar "há quantos anos estou neste plano". Pergunte: esse plano ainda faz sentido pra minha empresa hoje?',
        'Se marcou pelo menos um item da lista — é hora de sentar com um consultor e rever.\n\nSalva esse post para usar na sua próxima renovação.\n\n#planodesaude #cnpj #gustavojcluz #gestaoempresarial #planoempresarial #corretordeseguros',
        'Trocar de plano não é infidelidade. É inteligência financeira.\n\nManda pro empresário parceiro que renova automaticamente todo ano sem questionar.\n\nBora, pra cima! 🚀💪\n\n#planodesaude #cnpj #gustavojcluz #planoempresarial'
    ];

    // 0-based: quais slides usam fundo claro (bege)
    const LIGHT_SLIDES  = [1, 3, 5];
    // 0-based: quais slides usam fundo escuro quente
    const WARM_SLIDES   = []; // slide 3 voltou para navy padrão

    function createSlideElement(index) {
        const slide = document.createElement('div');
        slide.className = 'slide';
        if (LIGHT_SLIDES.includes(index))  slide.classList.add('bg-sand');
        else if (WARM_SLIDES.includes(index)) slide.classList.add('bg-warm');
        else slide.classList.add('bg-navy');
        const arrowHTML = (index < 6) ? '<div class="arrow"><div class="arrow-line"></div><div class="arrow-head"></div></div>' : '';
        slide.innerHTML = SLIDES_HTML[index] + arrowHTML;
        return slide;
    }

    function buildPreviews() {
        const grid = document.getElementById('slidesGrid');
        grid.innerHTML = '';
        SLIDES_HTML.forEach((_, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';
            const label = document.createElement('div');
            label.className = 'slide-label';
            label.textContent = LABELS[i];
            const scaler = document.createElement('div');
            scaler.className = 'slide-scaler';
            const slide = createSlideElement(i);
            scaler.appendChild(slide);
            const footer = document.createElement('div');
            footer.className = 'slide-footer';
            const btnDl = document.createElement('button');
            btnDl.className = 'btn-download';
            btnDl.textContent = `📥 Baixar Slide ${i + 1}`;
            btnDl.onclick = () => downloadSinglePNG(i, btnDl);
            footer.appendChild(btnDl);
            const legendaBox = document.createElement('div');
            legendaBox.className = 'legenda-box';
            legendaBox.innerHTML = `
                <textarea class="legenda-textarea" id="leg_slide_${i}">${LEGENDAS[i]}</textarea>
                <button class="btn-copy-legenda" id="btn_leg_${i}" onclick="copySlideLeg(${i})">📋 Copiar legenda (Slide ${i + 1})</button>
            `;
            wrapper.appendChild(label);
            wrapper.appendChild(scaler);
            wrapper.appendChild(footer);
            wrapper.appendChild(legendaBox);
            grid.appendChild(wrapper);
            requestAnimationFrame(() => {
                slide.style.transform = `scale(${scaler.offsetWidth / 1080})`;
                slide.style.transformOrigin = 'top left';
            });
        });
    }

    function copySlideLeg(index) {
        const text = document.getElementById(`leg_slide_${index}`).value;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById(`btn_leg_${index}`);
            btn.textContent = '✅ Copiado!';
            btn.style.background = '#059669'; btn.style.color = '#fff';
            setTimeout(() => { btn.textContent = `📋 Copiar legenda (Slide ${index + 1})`; btn.style.background = '#222'; btn.style.color = '#bbb'; }, 2000);
        });
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    async function renderSlide(index) {
        const area = document.getElementById('renderArea');
        const slide = createSlideElement(index);
        area.appendChild(slide);
        area.style.zIndex = '9999'; area.style.opacity = '1';
        slide.style.transform = 'none';
        await new Promise(r => setTimeout(r, 500));
        let bgColor = '#0B1D3A';
        if (LIGHT_SLIDES.includes(index)) bgColor = '#F0EBE3';
        else if (WARM_SLIDES.includes(index)) bgColor = '#1A0F0A';
        const canvas = await html2canvas(slide, { width: 1080, height: 1350, scale: 1, useCORS: true, backgroundColor: bgColor, logging: false });
        area.removeChild(slide); area.style.zIndex = '-1';
        return canvas;
    }

    async function downloadSinglePNG(index, btn) {
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = '⏳ Gerando...';
        try {
            const canvas = await renderSlide(index);
            const link = document.createElement('a');
            link.download = `Fidelidade_Slide_${index + 1}.png`;
            link.href = canvas.toDataURL('image/png'); link.click();
            btn.textContent = '✅ Baixado!';
            setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
        } catch (e) { btn.textContent = '❌ Erro'; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000); }
    }

    async function downloadAllPNGs() {
        setStatus('Gerando todos os PNGs — aguarde...');
        try {
            for (let i = 0; i < SLIDES_HTML.length; i++) {
                setStatus(`Baixando slide ${i + 1} de ${SLIDES_HTML.length}...`);
                const canvas = await renderSlide(i);
                const link = document.createElement('a');
                link.download = `Fidelidade_Slide_${i + 1}.png`;
                link.href = canvas.toDataURL('image/png'); link.click();
                await new Promise(r => setTimeout(r, 900));
            }
            setStatus('✅ Todas as imagens baixadas com sucesso!');
        } catch (e) { setStatus('❌ Erro: ' + e.message); }
    }

    async function downloadPDF() {
        setStatus('Gerando PDF — aguarde...');
        try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [108, 135] });
            for (let i = 0; i < SLIDES_HTML.length; i++) {
                setStatus(`Renderizando slide ${i + 1} de ${SLIDES_HTML.length}...`);
                const canvas = await renderSlide(i);
                const imgData = canvas.toDataURL('image/png');
                if (i > 0) pdf.addPage([108, 135]);
                pdf.addImage(imgData, 'PNG', 0, 0, 108, 135);
            }
            pdf.save('Fidelidade_Carrossel_GustavoLima.pdf');
            setStatus('✅ PDF baixado!');
        } catch (e) { setStatus('❌ Erro: ' + e.message); }
    }

    document.fonts.ready.then(() => setTimeout(buildPreviews, 300));
    window.addEventListener('resize', () => {
        document.querySelectorAll('.slide-scaler').forEach(scaler => {
            const slide = scaler.querySelector('.slide');
            if (slide) slide.style.transform = `scale(${scaler.offsetWidth / 1080})`;
        });
    });
    </script>
</body>
</html>
