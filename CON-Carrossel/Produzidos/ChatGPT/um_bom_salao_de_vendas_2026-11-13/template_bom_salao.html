<template data-slide-template><div class="frame"><h2 class="t-large">Você faz parte de uma equipe ou só divide a sala com <span class="hl-accent">outras pessoas?</span></h2><div class="context"><p class="promise">Vou te mostrar como um bom salão de vendas funciona.</p><p class="explain">A ideia é você reconhecer, nas situações do dia a dia, o que diferencia um ambiente que ajuda você a crescer de um que te deixa sozinho.</p></div></div></template>
<template data-slide-template><div class="frame"><h2 class="t-large">Imagina essa cena.</h2><div class="layout-vertical"><div class="text-col"><p>Você está falando com um cliente. A conversa vai bem, até ele fazer uma pergunta que você não sabe responder.</p><p>Você pede um instante e olha pro lado. Tem alguém ali que já passou por aquilo.</p><p>Você chama, explica a dúvida e espera uma orientação.</p></div><div class="img-box-vertical" role="img" aria-label="Cena ilustrativa: mulher ao telefone pede um instante de ajuda a um colega"></div></div><p class="scene-end">O que acontece depois diz muito sobre esse salão.</p></div></template>
<template data-slide-template><div class="frame"><h2 class="t-large">Você pergunta, mas a ajuda nunca chega.</h2><div class="body-copy"><div class="comp-col first-paragraph">A informação fica com quem já sabe. Quem acabou de entrar precisa descobrir tudo sozinho. Quando aparece um erro, vem a cobrança, mas ninguém explica como fazer melhor.</div><p class="consequence">Depois de passar por isso algumas vezes, você começa a evitar perguntas.</p><div class="gold-rule"></div><p class="lonely">Tem gente perto. Só que você aprende a se virar sem contar com ninguém.</p></div></div></template>
<template data-slide-template><div class="frame"><h2 class="t-large">Alguém te orienta,<span class="h2-support">mostra onde conferir a informação ou combina de te ajudar assim que terminar o atendimento.</span></h2><div class="body-copy"><p>Você volta ao cliente com mais segurança e aprende como resolver aquela situação da próxima vez.</p><div class="comp-col help-card">Quem está começando encontra apoio. Quem já tem experiência compartilha o que sabe.</div></div><p class="ask">E perguntar faz parte do trabalho.</p></div></template>
<template data-slide-template><div class="frame"><h2 class="t-large">Quer reconhecer um bom salão? Repara nisso:</h2><div class="signs"><div class="sign"><span class="checkmark" aria-hidden="true">✓</span><span>Quando alguém tem uma dúvida, encontra orientação.</span></div><div class="sign"><span class="checkmark" aria-hidden="true">✓</span><span>Quando alguém aprende algo útil, compartilha.</span></div><div class="sign"><span class="checkmark" aria-hidden="true">✓</span><span>Quando uma venda sai, tem gente que comemora junto.</span></div><div class="sign"><span class="checkmark" aria-hidden="true">✓</span><span>Depois da comemoração, o cliente continua sendo acompanhado.</span></div></div><p class="takeaway">Esses hábitos vão dando ao salão uma cultura e um jeito próprio de trabalhar.</p></div><div class="absolute-footer">Salva pra observar no seu dia a dia.<svg class="icon-save" viewBox="0 0 24 24" aria-hidden="true"><polygon points="20 21 12 13.44 4 21 4 3 20 3 20 21"></polygon></svg></div></template>
