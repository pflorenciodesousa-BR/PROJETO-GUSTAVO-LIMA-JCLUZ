  <header class="toolbar">

  <template data-slide-template>
    <div class="cover-art"></div>
    <div class="overlay-capa"></div>
    <div class="content-capa"><p class="cover-statement">Na sua agência, você acompanha produção de conteúdo, ads e funil.</p><h2 class="cover-question">Seu plano de saúde recebe a mesma atenção?</h2></div>
  </template>
  <template data-slide-template>
    <div class="frame"><p class="sub-question">Qual é o <span class="sub-underline">melhor plano de saúde</span> para</p><h2>Donos de agência<br>de marketing?</h2><p class="lead">Separei uma cotação para um casal e uma criança pequena. Olha o que eu considerei.</p></div>
  </template>
  <template data-slide-template>
    <svg class="business-sketch" viewBox="0 0 1080 1350" aria-hidden="true"><g transform="translate(610 90) rotate(13)"><rect width="340" height="600" rx="45"></rect><rect x="18" y="58" width="304" height="460" rx="10"></rect><path d="M120 31h100M130 555h80M65 152h200M65 205h120M65 298h200M65 350h155"></path></g></svg>
    <div class="frame conversational"><h2>Entre uma reunião e outra, você quer conseguir marcar uma consulta.</h2><div class="body-copy"><p>Eu olharia o que dá pra resolver pelo app e como funcionam as autorizações.</p><p>Se você quer teleatendimento, a gente confere se ele está disponível e em quais condições no plano cotado.</p></div></div>
  </template>
  <template data-slide-template>
    <svg class="business-sketch" viewBox="0 0 1080 1350" aria-hidden="true"><path d="M30 235l300-130 370 110 350-140M10 1060l320 175 370-120 350 120M330 105v1130M700 215v900M0 460l1080 320M0 900l1080-400"></path><path d="M785 250c-65 0-118 53-118 118 0 85 118 198 118 198s118-113 118-198c0-65-53-118-118-118z"></path><circle cx="785" cy="368" r="38"></circle></svg>
    <div class="frame conversational"><h2>Seu cliente pode estar em outra cidade.<br>E o hospital que você usaria?</h2><div class="conversation-card"><p>Você atende de casa ou vive viajando? Sua família precisa de atendimento no mesmo bairro?</p><p>Eu conferiria, na rede atual de cada produto, os hospitais e laboratórios que vocês realmente usariam.</p></div></div>
  </template>
  <template data-slide-template>
    <svg class="business-sketch" viewBox="0 0 1080 1350" aria-hidden="true"><g transform="translate(670 100) rotate(18)"><rect width="340" height="500" rx="18"></rect><path d="M45 80h250M45 135h250M45 220h150M45 275h250M45 330h250M180 430l35 30 70-90"></path></g></svg>
    <div class="frame conversational"><h2>Você fecharia um projeto olhando só o valor da proposta?</h2><div class="gold-rule"></div><div class="body-copy"><p>No plano de saúde, eu também quero te mostrar o que está por trás do preço: <strong>coparticipação</strong> (o que pode ser cobrado quando você usa), <strong>carências</strong> e <strong>regras de reajuste</strong>.</p><p>A mensalidade entra na comparação junto com essas condições.</p></div></div>
  </template>
  <template data-slide-template>

  </template>
  <template data-slide-template>
    <div class="frame"><p class="offer-intro">Para essa cotação, minha escolha foi:</p><h2>SulAmérica<span class="product-name">Especial 100</span></h2><div class="offer-network">Barra D’Or · Oeste D’Or<br>Hospital Vitória</div><div class="offer-benefits"><div>Quarto privativo</div><div>Telemedicina</div><div>Acesso ao Wellhub**</div><div>Seguro de vida</div></div><p class="offer-app">Serviços pelo aplicativo.</p><div class="offer-price-box"><div class="offer-profile">Casal + criança pequena</div><div class="offer-price">R$ 1.858<span>/mês*</span></div><div class="offer-price-note">Valor desta cotação.</div></div><p class="offer-conditions">*Valores, rede e benefícios sujeitos a alteração conforme a data, o perfil e as condições de contratação. Solicite uma cotação atualizada.<br>**Assinatura do Wellhub à parte.</p></div>
  </template>
  <template data-slide-template>
    <div class="frame"><h2>E aí, o que você achou dessa cotação?</h2><p class="lead">Se você também precisa de ajuda para montar a sua cotação,</p><div class="cta">comenta nesta postagem<br>que vamos te ajudar!</div></div><div class="absolute-footer">Bora, pra cima! 🚀💪</div>
  </template>

  <script>
    const SLIDES_HTML=Array.from(document.querySelectorAll('template[data-slide-template]'),t=>t.innerHTML);
    const LABELS=['Capa · Atlas','Subcapa','Entre reuniões','Onde você usa','Além do preço','Salvável','Cotação · Especial 100','Convite'];
    const LEGENDA_MODE='unica';
    const LEGENDA_UNICA='Quando o cliente pede “só um orçamento”, você sabe que ainda precisa entender o projeto.\n\nNa hora de cotar seu plano de saúde, eu também quero conhecer o seu briefing. Se você já tem um plano, o que tem funcionado e o que dá trabalho? Se está procurando o primeiro, o que espera conseguir resolver com ele?\n\nEssa conversa ajuda a definir o que vamos conferir nas propostas. Na JCLUZ, são mais de 23 anos ajudando pessoas e empresas nessa decisão.\n\nO valor apresentado é de uma cotação real para o perfil informado. Valores, rede e benefícios podem mudar conforme a data, o perfil e as condições de contratação. Solicite uma cotação atualizada. A assinatura do Wellhub é contratada à parte.\n\nE aí, o que você achou dessa cotação? Se você também precisa de ajuda para montar a sua, comenta nesta postagem que vamos te ajudar!\n\nBora, pra cima! 🚀💪';
    const LEGENDAS=[];
    const LIGHT_SLIDES=[1,3,6];
    const GOLD_SLIDES=[5];
    function createSlideElement(index){
      const slide=document.createElement('article');
      slide.className='slide slide-'+['capa','two','three','four','five','six','offer','seven'][index];
      if(LIGHT_SLIDES.includes(index))slide.classList.add('bg-light');
      if(GOLD_SLIDES.includes(index))slide.classList.add('bg-gold');
      slide.innerHTML=SLIDES_HTML[index];
      return slide;
    }
    function createLegendaBox(key,value){
      const box=document.createElement('div');box.className='legenda-box';
      const title=document.createElement('h2');title.textContent='Legenda sugerida';
      const ta=document.createElement('textarea');ta.className='legenda-textarea';ta.id='leg_'+key;ta.value=value;
      const btn=document.createElement('button');btn.className='btn-copy-legenda';btn.id='btn_leg_'+key;btn.textContent='Copiar legenda';btn.onclick=()=>copySlideLeg(key);
      box.append(title,ta,btn);return box;
    }
    function setStatus(msg){document.getElementById('status').textContent=msg}
    function buildPreviews(){
      const grid=document.getElementById('slidesGrid');const cap=document.getElementById('singleCaption');
      grid.replaceChildren();cap.replaceChildren();
      if(!['unica','por_slide'].includes(LEGENDA_MODE)){setStatus('Modo de legenda inválido.');return}
      if(LEGENDA_MODE==='por_slide'&&LEGENDAS.length!==SLIDES_HTML.length){setStatus('Falta legenda para um slide.');return}
      SLIDES_HTML.forEach((_,i)=>{
        const wrap=document.createElement('section');wrap.className='slide-wrapper';
        const label=document.createElement('div');label.className='slide-label';label.innerHTML='<span>Slide '+(i+1)+'</span><span>'+LABELS[i]+'</span>';
        const scaler=document.createElement('div');scaler.className='slide-scaler';
        const slide=createSlideElement(i);scaler.appendChild(slide);
        const foot=document.createElement('div');foot.className='slide-footer';
        const btn=document.createElement('button');btn.className='btn alt';btn.textContent='Baixar PNG';btn.onclick=()=>downloadSinglePNG(i,btn);foot.appendChild(btn);
        wrap.append(label,scaler,foot);
        if(LEGENDA_MODE==='por_slide')wrap.appendChild(createLegendaBox('slide_'+i,LEGENDAS[i]));
        grid.appendChild(wrap);
        requestAnimationFrame(()=>slide.style.transform='scale('+(scaler.clientWidth/1080)+')');
      });
      if(LEGENDA_MODE==='unica')cap.appendChild(createLegendaBox('unica',LEGENDA_UNICA));
    }
    function copySlideLeg(key){
      const value=document.getElementById('leg_'+key).value;
      navigator.clipboard.writeText(value).then(()=>{const btn=document.getElementById('btn_leg_'+key);btn.textContent='Copiada!';setTimeout(()=>btn.textContent='Copiar legenda',2000)}).catch(()=>setStatus('Selecione e copie o texto da legenda.'));
    }
    async function renderSlide(index){
      await document.fonts.ready;
      const stage=document.getElementById('renderArea');
      const slide=createSlideElement(index);
      slide.classList.add('exporting');slide.style.transform='none';slide.style.position='relative';
      stage.replaceChildren(slide);
      await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
      try{return await html2canvas(slide,{width:1080,height:1350,scale:1,useCORS:true,backgroundColor:null,logging:false,scrollX:0,scrollY:0})}
      finally{stage.replaceChildren()}
    }
    async function downloadSinglePNG(index,button){
      button.disabled=true;setStatus('Gerando slide '+(index+1)+'...');
      try{const canvas=await renderSlide(index);const link=document.createElement('a');link.href=canvas.toDataURL('image/png');link.download='plano_agencia_slide_'+String(index+1).padStart(2,'0')+'.png';link.click();setStatus('PNG baixado.')}
      catch(e){setStatus('Erro ao exportar: '+e.message)}finally{button.disabled=false}
    }
    async function downloadZIP(){
      const buttons=document.querySelectorAll('.btn');buttons.forEach(b=>b.disabled=true);
      try{const zip=new JSZip();for(let i=0;i<SLIDES_HTML.length;i++){setStatus('Gerando PNG '+(i+1)+' de '+SLIDES_HTML.length+'...');const canvas=await renderSlide(i);zip.file('plano_agencia_slide_'+String(i+1).padStart(2,'0')+'.png',canvas.toDataURL('image/png').split(',')[1],{base64:true})}
        const blob=await zip.generateAsync({type:'blob'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='plano_de_saude_para_dono_de_agencia.zip';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),5000);setStatus('ZIP baixado.')}
      catch(e){setStatus('Erro ao exportar: '+e.message)}finally{buttons.forEach(b=>b.disabled=false)}
    }
    async function downloadPDF(){
      const buttons=document.querySelectorAll('.btn');buttons.forEach(b=>b.disabled=true);
      try{const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'px',format:[1080,1350]});for(let i=0;i<SLIDES_HTML.length;i++){setStatus('Montando PDF, slide '+(i+1)+' de '+SLIDES_HTML.length+'...');const canvas=await renderSlide(i);if(i)pdf.addPage([1080,1350],'portrait');pdf.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,1080,1350)}
        pdf.save('plano_de_saude_para_dono_de_agencia.pdf');setStatus('PDF baixado.')}
      catch(e){setStatus('Erro ao exportar: '+e.message)}finally{buttons.forEach(b=>b.disabled=false)}
    }
    document.fonts.ready.then(buildPreviews);
    window.addEventListener('resize',()=>document.querySelectorAll('.slide-scaler').forEach(s=>{const slide=s.querySelector('.slide');if(slide)slide.style.transform='scale('+(s.clientWidth/1080)+')'}));
  </script>
</body>
</html>
