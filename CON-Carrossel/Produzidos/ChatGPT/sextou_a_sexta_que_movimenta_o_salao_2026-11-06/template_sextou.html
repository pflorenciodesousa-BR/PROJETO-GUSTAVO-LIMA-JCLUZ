<header class="toolbar"><div><h1>SEXTOU: A SEXTA QUE MOVIMENTA O SALÃO</h1><p>Gustavo Lima · 7 slides · 1080 × 1350</p></div><div class="actions"><button class="btn alt" onclick="downloadZIP()">Baixar PNGs</button><button class="btn" onclick="downloadPDF()">Baixar PDF</button></div></header>

<template data-slide-template>
<div class="cover-art"></div><div class="overlay-capa"></div><div class="content-capa"><h2 class="cover-title">É tudo pelo<br>dinheiro <span class="gold">ou tem<br>outra coisa?</span></h2></div>
</template>
<template data-slide-template>
<div class="frame"><h2 class="t-large">O que faz um colega de trabalho virar alguém com quem você <span class="hl-accent">gosta de estar?</span></h2><p class="context t-reg">Dividir a rotina aproxima. Ter momentos pra conversar, rir e descobrir afinidades ajuda a criar esse vínculo.</p><p class="invitation">É por isso que eu quero te mostrar o nosso <strong>SEXTOU.</strong></p></div>
</template>
<template data-slide-template>
<div class="frame"><h2 class="t-large">Você passa boa parte do seu dia ao lado dessas pessoas.</h2><div class="img-box-horizontal" role="img" aria-label="Pessoas comemorando juntas no salão, com braços levantados e celulares registrando o encontro"></div><div class="body-copy t-reg"><p>Num bom salão, tem espaço pra pedir ajuda numa negociação, aprender com quem está perto e dar uma risada entre um atendimento e outro.</p><p class="last">Com essa convivência, o colega de trabalho também pode virar alguém com quem você gosta de estar.</p></div></div>
</template>
<template data-slide-template>
<div class="frame"><h2 class="t-large">Toda sexta tem um<br>encontro marcado.</h2><div class="gold-rule"></div><div class="body-copy t-reg"><p>Aqui na JCLUZ, o Sextou reúne o salão para premiar <strong>os melhores vendedores de cada equipe e o melhor supervisor.</strong> Também tem sorteio.</p><div class="comp-col recognition">A gente reconhece os resultados da semana e abre espaço pra equipe se divertir junto.</div><p class="closing">Eu quero que as pessoas tenham esses momentos pra compartilhar.</p></div></div>
</template>
<template data-slide-template>
<div class="frame"><p class="opening">Trabalhar no mesmo salão é o começo. Se sentir parte de uma equipe vai sendo construído na convivência.</p><div class="img-box-horizontal" role="img" aria-label="Equipe reunida no salão, sorrindo e segurando a bandeira da JCLUZ"></div><p class="body-copy">Quando a gente se reúne pra se divertir, conhece um pouco mais de quem está ao lado. Descobre gostos em comum, dá risada junto e vai criando afinidade.</p><p class="because">É por isso que eu valorizo tanto o Sextou.</p><p class="highlight">Quero que as pessoas tenham motivos pra gostar de estar aqui, inclusive umas pelas outras.</p></div>
</template>
<template data-slide-template>
<div class="frame"><h2 class="t-large">É assim que eu quero ver o nosso salão.</h2><div class="comp-col body-copy"><p>Com vontade de vender e conquistar resultados, claro.</p><p>E com pessoas que se sintam à vontade pra conversar, ajudar umas às outras e comemorar juntas.</p></div><p class="closing">O Sextou tem lugar nessa cultura porque cria um momento pra cuidar dessa convivência. Um ambiente amigável também precisa de tempo pra acontecer.</p></div>
</template>
<template data-slide-template>
<div class="frame"><h2 class="t-large">Tem alguém que deixa sua semana de trabalho <span class="gold">mais leve?</span></h2><p class="cta">Marca essa pessoa aqui.</p><p class="context">Ela merece saber que faz diferença na sua rotina.</p></div><div class="absolute-footer">Bora, pra cima! 🚀💪</div>
</template>
