<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Saúde Não é Produto de Prateleira — Gustavo Lima</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 30px 20px; }
        h1 { text-align: center; font-size: 22px; color: #fff; margin-bottom: 6px; }
        .page-subtitle { text-align: center; color: #777; font-size: 13px; margin-bottom: 30px; }
        .btn-container { text-align: center; margin: 0 0 30px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { border: none; padding: 14px 36px; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-family: 'Montserrat', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
        .btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #444; }
        .btn-secondary:hover { background: #3a3a3a; color: #fff; }
        .status { text-align: center; color: #3b82f6; margin: 10px 0 20px; font-size: 13px; font-weight: bold; min-height: 20px; }
        .slides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; max-width: 1400px; margin: 0 auto; }
        .slide-wrapper { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a2a; transition: all 0.2s; display: flex; flex-direction: column; }
        .slide-wrapper:hover { border-color: #3b82f6; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .slide-scaler { width: 100%; aspect-ratio: 1080 / 1350; overflow: hidden; position: relative; }
        .slide-label { padding: 8px 10px 4px; font-size: 12px; color: #777; text-align: center; background: #151515; font-weight: bold; }
        .slide-footer { display: flex; justify-content: center; padding: 6px 10px 10px; background: #151515; }
        .btn-download { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; border: none; padding: 8px 20px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: 'Montserrat', sans-serif; width: 100%; }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .btn-download:disabled { opacity: 0.5; cursor: wait; }
        .legenda-box { background: #111; padding: 12px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        .legenda-textarea { width: 100%; height: 110px; background: #000; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 10px; font-size: 12px; font-family: 'Segoe UI', sans-serif; resize: vertical; line-height: 1.5; }
        .legenda-textarea:focus { outline: none; border-color: #3b82f6; }
        .btn-copy-legenda { background: #222; color: #bbb; border: 1px solid #444; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: 600; transition: all 0.2s; }
        .btn-copy-legenda:hover { background: #333; color: #fff; border-color: #555; }

        /* ===================== ESTILOS DOS SLIDES ===================== */
        .slide {
            width: 1080px; height: 1350px;
            background: linear-gradient(160deg, #0B1D3A 0%, #0F2444 30%, #0A1A35 55%, #0D2040 80%, #091830 100%);
            display: flex; flex-direction: column; justify-content: center;
            padding: 110px 95px; position: relative;
            font-family: 'Montserrat', sans-serif; transform-origin: top left;
            overflow: hidden;
        }
        .slide.bg-light {
            background: #F0EBE3;
            color: #0B1D3A;
        }

        /* Seta de navegação */
        .slide .arrow { position: absolute; bottom: 75px; right: 75px; display: flex; align-items: center; z-index: 10; }
        .slide .arrow-line { width: 110px; height: 2px; background: rgba(255,255,255,0.3); }
        .slide .arrow-head { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 13px solid rgba(255,255,255,0.3); }
        .slide.bg-light .arrow-line { background: rgba(11,29,58,0.3); }
        .slide.bg-light .arrow-head { border-left-color: rgba(11,29,58,0.3); }

        /* Tipografia */
        .t-reg  { font-size: 39px; font-weight: 400; color: rgba(255,255,255,0.85); line-height: 1.5; }
        .t-bold { font-size: 39px; font-weight: 900; color: #ffffff; line-height: 1.35; letter-spacing: -0.5px; }
        .t-large { font-size: 54px; font-weight: 900; color: #ffffff; line-height: 1.18; letter-spacing: -1px; text-transform: uppercase; }
        .t-small { font-size: 32px; font-weight: 400; color: rgba(255,255,255,0.5); line-height: 1.5; }
        .t-accent { font-weight: 900; color: #60a5fa; }

        .slide.bg-light .t-reg  { color: rgba(11,29,58,0.85); }
        .slide.bg-light .t-bold { color: #0B1D3A; }
        .slide.bg-light .t-large { color: #0B1D3A; }
        .slide.bg-light .t-small { color: rgba(11,29,58,0.5); }

        /* Grifos */
        /* Grifos */
        .hl-gold { background: rgba(234,179,8,0.3) !important; color: #fff !important; padding: 4px 14px; border-radius: 8px; display: inline-block; }
        .hl { background: rgba(11,29,58,0.15) !important; color: #0B1D3A !important; padding: 4px 14px; border-radius: 8px; display: inline-block; }

        /* Espaçadores */
        .sp    { height: 32px; }
        .sp-sm { height: 16px; }
        .sp-xs { height: 8px; }

        /* Tabela do Slide 3 */
        .compare-table { width: 100%; border-collapse: separate; border-spacing: 0 14px; }
        .compare-table td { padding: 20px 28px; font-size: 32px; font-weight: 400; vertical-align: middle; }
        .compare-table .col-left { background: rgba(255,255,255,0.05); border-radius: 10px 0 0 10px; color: rgba(255,255,255,0.55); width: 48%; }
        .compare-table .col-right { background: rgba(234,179,8,0.12); border-radius: 0 10px 10px 0; color: #EAB308; font-weight: 700; width: 52%; }
        .compare-table .col-arrow { color: rgba(255,255,255,0.3); font-size: 28px; padding: 0 10px; text-align: center; }

        /* Área de renderização oculta */
        #renderArea { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>

    <h1>🛒 Carrossel — Plano de Saúde Não é Produto de Prateleira</h1>
    <p class="page-subtitle">Framework Q.B.O. — Gustavo Lima (JCLUZ) | Legendas Individuais Ativadas</p>

    <div class="btn-container">
        <button class="btn btn-primary" onclick="downloadAllPNGs()">📦 Baixar TODOS os PNGs</button>
        <button class="btn btn-secondary" onclick="downloadPDF()">📄 Baixar PDF completo</button>
    </div>
    <div class="status" id="status"></div>

    <div class="slides-grid" id="slidesGrid"></div>
    <div id="renderArea"></div>

    <script>
    const SLIDES_HTML = [

        // ── SLIDE 1 — Gancho / Capa Hero ──────────────────────────────────────────
        `<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('COVER_B64_HERE'); background-size: cover; background-position: center top; z-index: 1;"></div>
         <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 65%; background: linear-gradient(to top, rgba(11,29,58,1) 0%, rgba(11,29,58,0.9) 30%, rgba(11,29,58,0.6) 60%, rgba(11,29,58,0) 100%); z-index: 2;"></div>
         <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 0 95px 120px; z-index: 3; display: flex; flex-direction: column; align-items: center; text-align: center;">
             <div class="t-large" style="font-size: 70px; text-shadow: 2px 2px 8px rgba(0,0,0,0.7);">PLANO DE SAÚDE<br>NÃO É PRODUTO<br>DE PRATELEIRA.</div>
             <div class="sp-sm"></div>
             <div class="t-reg" style="font-size: 35px; color: rgba(255,255,255,0.75);">Mas é exatamente assim que a maioria escolhe.</div>
         </div>`,

        // ── SLIDE 2 — Segunda Chance / Comparação (BEGE) ──────────────────────────
        `<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #F0EBE3; z-index: -1;"></div>
         <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('SKETCH2_B64_HERE'); background-size: cover; mix-blend-mode: darken; filter: brightness(1.05); opacity: 0.22; z-index: 0;"></div>
         <div style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center;">
             <div class="t-reg" style="color: rgba(11,29,58,0.85);">Você troca de camiseta por R$&nbsp;80<br>se não gostar do tecido.</div>
             <div class="sp"></div>
             <div class="t-bold" style="color: #0B1D3A; font-size: 44px;">Mas e quando você descobre<br>que o plano escolhido não cobre<br>o hospital mais perto de casa?</div>
             <div class="sp"></div>
             <div class="t-bold hl" style="font-size: 36px;">Não tem troca. Não tem devolução.<br>Tem carência.</div>
         </div>`,

        // ── SLIDE 3 — Slide Salvável / Tabela de Comparação (ESCURO) ───────────────
        `<div style="position: relative; z-index: 2; width: 100%;">
             <div class="t-bold" style="font-size: 46px; margin-bottom: 8px;">O que você vê</div>
             <div class="t-small" style="font-size: 30px; margin-bottom: 40px;">versus o que você realmente assina</div>
             <table class="compare-table">
                 <tr>
                     <td class="col-left">Preço da mensalidade</td>
                     <td class="col-arrow">→</td>
                     <td class="col-right">Contrato jurídico de 12+ meses</td>
                 </tr>
                 <tr>
                     <td class="col-left">Nome da operadora</td>
                     <td class="col-arrow">→</td>
                     <td class="col-right">Rede que pode mudar amanhã</td>
                 </tr>
                 <tr>
                     <td class="col-left">Cobertura listada</td>
                     <td class="col-arrow">→</td>
                     <td class="col-right">Carências de até 24 semanas</td>
                 </tr>
                 <tr>
                     <td class="col-left">Benefício bonito</td>
                     <td class="col-arrow">→</td>
                     <td class="col-right">Reajuste que chega todo ano</td>
                 </tr>
                 <tr>
                     <td class="col-left">Assistência 24h</td>
                     <td class="col-arrow">→</td>
                     <td class="col-right">Suporte que existe (ou não)</td>
                 </tr>
             </table>
         </div>`,

        // ── SLIDE 4 — Constrói a Objeção (BEGE) ────────────────────────────────────
        `<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #F0EBE3; z-index: -1;"></div>
         <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('SKETCH4_B64_HERE'); background-size: cover; mix-blend-mode: darken; filter: brightness(1.05); opacity: 0.22; z-index: 0;"></div>
         <div style="position: relative; z-index: 2;">
             <div class="t-reg" style="color: rgba(11,29,58,0.75);">Aí você pensa:</div>
             <div class="sp-sm"></div>
             <div class="t-bold" style="color: #0B1D3A; font-size: 48px; background: rgba(11,29,58,0.07); padding: 44px 48px; border-left: 8px solid #0B1D3A; border-radius: 0 14px 14px 0; line-height: 1.4;">"Mas eu comparei<br>três planos no Google<br>antes de contratar..."</div>
             <div class="sp"></div>
             <div class="t-reg" style="color: rgba(11,29,58,0.75);">Comparou o preço. A mensalidade. O nome do hospital.</div>
         </div>`,

        // ── SLIDE 5 — Quebra a Objeção 1 (ESCURO) ──────────────────────────────────
        `<div style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center;">
             <div class="t-reg">Mas sabe o índice de reajuste<br>que vem no 13º mês?</div>
             <div class="sp"></div>
             <div class="t-reg">Sabe se o hospital continua<br>na rede em 2026?</div>
             <div class="sp"></div>
             <div class="t-reg">Sabe o que acontece com sua<br>coparticipação numa internação<br>de 5 dias?</div>
             <div class="sp"></div>
             <div class="t-bold hl-gold" style="font-size: 36px; line-height: 1.5;">Plano de saúde não tem etiqueta de preço.<br>Tem contrato de risco.</div>
         </div>`,

        // ── SLIDE 6 — Node Journey (ESCURO + Sketch Uni-Duni-Tê) ──────────────────
        `<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('SKETCH6_B64_HERE'); background-position: bottom center; background-size: cover; opacity: 0.9; z-index: 0;"></div>
         <div style="position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; padding: 60px 0 0 0;">
             <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;" viewBox="0 0 1080 1350">
                 <path d="M 160 200 C 500 200, 600 450, 900 450 C 1100 450, 850 700, 300 700" fill="transparent" stroke="rgba(255,255,255,0.12)" stroke-width="5" stroke-dasharray="14 10"/>
             </svg>
             <div style="display: flex; align-items: flex-start; margin-bottom: 120px; padding-left: 60px;">
                 <div style="width: 44px; height: 44px; background: #60a5fa; border-radius: 50%; border: 6px solid #0B1D3A; margin-right: 28px; flex-shrink: 0; margin-top: 8px;"></div>
                 <div class="t-reg" style="font-size: 38px;">O peso da marca da operadora<br>não garante leito em emergência.</div>
             </div>
             <div style="display: flex; align-items: flex-start; justify-content: flex-end; margin-bottom: 120px; padding-right: 60px;">
                 <div class="t-bold" style="font-size: 38px; text-align: right;">O que garante é o contrato<br>cobrir o hospital de confiança.</div>
                 <div style="width: 44px; height: 44px; background: #EAB308; border-radius: 50%; border: 6px solid #0B1D3A; margin-left: 28px; flex-shrink: 0; margin-top: 8px;"></div>
             </div>
             <div style="display: flex; align-items: flex-start; padding-left: 100px;">
                 <div style="width: 44px; height: 44px; background: #fff; border-radius: 50%; border: 6px solid #0B1D3A; margin-right: 28px; flex-shrink: 0; margin-top: 8px;"></div>
                 <div class="t-reg" style="font-size: 38px;">Com uma margem de reajuste<br>que o caixa da família suporta.</div>
             </div>
         </div>`,

        // ── SLIDE 7 — Quebra Final (BEGE) ──────────────────────────────────────────
        `<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #F0EBE3; z-index: -1;"></div>
         <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('SKETCH7_B64_HERE'); background-size: cover; mix-blend-mode: darken; filter: brightness(1.05); opacity: 0.22; z-index: 0;"></div>
         <div style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center;">
             <div class="t-bold" style="color: #0B1D3A; font-size: 46px; line-height: 1.35;">Quem trata plano de saúde<br>como prateleira de mercado<br>assume um risco<br>que não percebe.</div>
             <div class="sp"></div>
             <div class="t-reg" style="color: rgba(11,29,58,0.75);">Quem contrata com quem conhece<br>o mercado sabe exatamente o que comprou.</div>
             <div class="sp"></div>
             <div class="t-bold hl" style="font-size: 34px;">E essa diferença aparece na hora<br>que mais importa.</div>
         </div>`,

        // ── SLIDE 8 — CTA de Conversão (ESCURO) ────────────────────────────────────
        `<div style="position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
             <div class="t-large" style="font-size: 68px; line-height: 1.15; text-align: center;">NÃO ESCOLHE<br>NA PRATELEIRA.<br><span class="hl-gold" style="font-size: 68px; display: inline-block; margin-top: 16px;">ESCOLHE COM<br>QUEM CONHECE<br>O CONTRATO.</span></div>
             <div class="sp"></div>
             <div class="t-reg" style="font-size: 36px; text-align: center; color: rgba(255,255,255,0.7);">Comenta aqui qual é a sua maior dúvida<br>sobre plano de saúde. Respondemos todos.</div>
             <div class="sp"></div>
             <div class="t-bold t-accent" style="font-size: 54px;">Bora, pra cima! 🚀💪</div>
         </div>`
    ];

    const LABELS = [
        'Slide 1 — Gancho / Capa Hero',
        'Slide 2 — Segunda Chance',
        'Slide 3 — Slide Salvável (Tabela)',
        'Slide 4 — Constrói a Objeção',
        'Slide 5 — Quebra a Objeção',
        'Slide 6 — Node Journey',
        'Slide 7 — Quebra Final',
        'Slide 8 — CTA de Conversão'
    ];

    const LEGENDAS = [
        // Slide 1
        'Você pesquisou o preço, comparou operadora e fechou. Mas e o contrato? E a rede credenciada? E o reajuste do próximo ano?',
        // Slide 2
        'Camiseta errada você devolve. Plano de saúde errado você descobre na fila do pronto-socorro.',
        // Slide 3
        'Salva esse slide. É o checklist que ninguém te mostra antes de assinar.',
        // Slide 4
        'Pesquisa rápida no Google não substitui quem lê o contrato por você.',
        // Slide 5
        'O plano barato de hoje pode ser o reajuste de 40% do ano que vem. Isso não aparece no comparador.',
        // Slide 6
        'Plano de saúde é uma decisão de longo prazo. Não de final de semana.',
        // Slide 7
        '23 anos de mercado ensinam uma coisa: o plano certo não é o mais barato. É o que não falha quando você mais precisar.',
        // Slide 8
        'Comenta aqui qual é a sua maior dúvida sobre plano de saúde. Respondemos todos.\n\nBora, pra cima! 🚀💪\n\n#planodesaude #cnpj #saudefamiliar #planoempresarial #corretordeseguros #gustavojcluz #planodesaudecnpj #planodesaudefamilia'
    ];

    const LIGHT_SLIDES = [1, 3, 6]; // índices 0-based dos slides com bg-light

    // ============================================================
    //  RENDERIZAÇÃO
    // ============================================================
    function createSlideElement(index) {
        const slide = document.createElement('div');
        slide.className = 'slide';
        if (LIGHT_SLIDES.includes(index)) slide.classList.add('bg-light');

        // Sem seta no slide 7 (CTA)
        const arrowHTML = (index < 7) ? '<div class="arrow"><div class="arrow-line"></div><div class="arrow-head"></div></div>' : '';
        slide.innerHTML = SLIDES_HTML[index] + arrowHTML;
        return slide;
    }

    function buildPreviews() {
        const grid = document.getElementById('slidesGrid');
        grid.innerHTML = '';
        SLIDES_HTML.forEach((_, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';

            const label = document.createElement('div');
            label.className = 'slide-label';
            label.textContent = LABELS[i];

            const scaler = document.createElement('div');
            scaler.className = 'slide-scaler';
            const slide = createSlideElement(i);
            scaler.appendChild(slide);

            const footer = document.createElement('div');
            footer.className = 'slide-footer';
            const btnDl = document.createElement('button');
            btnDl.className = 'btn-download';
            btnDl.textContent = `📥 Baixar Slide ${i + 1}`;
            btnDl.onclick = () => downloadSinglePNG(i, btnDl);
            footer.appendChild(btnDl);

            const legendaBox = document.createElement('div');
            legendaBox.className = 'legenda-box';
            legendaBox.innerHTML = `
                <textarea class="legenda-textarea" id="leg_slide_${i}">${LEGENDAS[i]}</textarea>
                <button class="btn-copy-legenda" id="btn_leg_${i}" onclick="copySlideLeg(${i})">📋 Copiar legenda (Slide ${i + 1})</button>
            `;

            wrapper.appendChild(label);
            wrapper.appendChild(scaler);
            wrapper.appendChild(footer);
            wrapper.appendChild(legendaBox);
            grid.appendChild(wrapper);

            requestAnimationFrame(() => {
                slide.style.transform = `scale(${scaler.offsetWidth / 1080})`;
                slide.style.transformOrigin = 'top left';
            });
        });
    }

    function copySlideLeg(index) {
        const text = document.getElementById(`leg_slide_${index}`).value;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById(`btn_leg_${index}`);
            btn.textContent = '✅ Copiado!';
            btn.style.background = '#059669';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.textContent = `📋 Copiar legenda (Slide ${index + 1})`;
                btn.style.background = '#222';
                btn.style.color = '#bbb';
            }, 2000);
        });
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    async function renderSlide(index) {
        const area = document.getElementById('renderArea');
        const slide = createSlideElement(index);
        area.appendChild(slide);
        area.style.zIndex = '9999';
        area.style.opacity = '1';
        slide.style.transform = 'none';
        await new Promise(r => setTimeout(r, 500));
        const bgColor = LIGHT_SLIDES.includes(index) ? '#F0EBE3' : '#0B1D3A';
        const canvas = await html2canvas(slide, {
            width: 1080, height: 1350, scale: 1,
            useCORS: true, backgroundColor: bgColor, logging: false
        });
        area.removeChild(slide);
        area.style.zIndex = '-1';
        return canvas;
    }

    async function downloadSinglePNG(index, btn) {
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = '⏳ Gerando...';
        try {
            const canvas = await renderSlide(index);
            const link = document.createElement('a');
            link.download = `Prateleira_Slide_${index + 1}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            btn.textContent = '✅ Baixado!';
            setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
        } catch (e) {
            btn.textContent = '❌ Erro';
            setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
        }
    }

    async function downloadAllPNGs() {
        setStatus('Gerando todos os PNGs — aguarde...');
        try {
            for (let i = 0; i < SLIDES_HTML.length; i++) {
                setStatus(`Baixando slide ${i + 1} de ${SLIDES_HTML.length}...`);
                const canvas = await renderSlide(i);
                const link = document.createElement('a');
                link.download = `Prateleira_Slide_${i + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                await new Promise(r => setTimeout(r, 900));
            }
            setStatus('✅ Todas as imagens baixadas com sucesso!');
        } catch (e) { setStatus('❌ Erro: ' + e.message); console.error(e); }
    }

    async function downloadPDF() {
        setStatus('Gerando PDF — aguarde...');
        try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [108, 135] });
            for (let i = 0; i < SLIDES_HTML.length; i++) {
                setStatus(`Renderizando slide ${i + 1} de ${SLIDES_HTML.length}...`);
                const canvas = await renderSlide(i);
                const imgData = canvas.toDataURL('image/png');
                if (i > 0) pdf.addPage([108, 135]);
                pdf.addImage(imgData, 'PNG', 0, 0, 108, 135);
            }
            pdf.save('Prateleira_Carrossel_GustavoLima.pdf');
            setStatus('✅ PDF baixado com sucesso!');
        } catch (e) { setStatus('❌ Erro: ' + e.message); console.error(e); }
    }

    document.fonts.ready.then(() => setTimeout(buildPreviews, 300));
    window.addEventListener('resize', () => {
        document.querySelectorAll('.slide-scaler').forEach(scaler => {
            const slide = scaler.querySelector('.slide');
            if (slide) slide.style.transform = `scale(${scaler.offsetWidth / 1080})`;
        });
    });
    </script>
</body>
</html>
