<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dupla Tributação — Gustavo Lima (V4)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: #111; color: #fff; padding: 30px 20px; }
        h1 { text-align: center; font-size: 22px; color: #fff; margin-bottom: 6px; }
        .page-subtitle { text-align: center; color: #777; font-size: 13px; margin-bottom: 30px; }
        .btn-container { text-align: center; margin: 0 0 30px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { border: none; padding: 14px 36px; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-family: 'Montserrat', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; }
        .btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #444; }
        .status { text-align: center; color: #3b82f6; margin: 10px 0 20px; font-size: 13px; font-weight: bold; min-height: 20px; }
        .slides-grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; max-width: 1400px; margin: 0 auto; }
        .slide-wrapper { display: flex; flex-direction: column; align-items: center; width: 400px; }
        .slide-label { margin-bottom: 10px; font-weight: bold; font-size: 13px; color: #999; text-align: center; }
        .slide-scaler { width: 400px; height: 500px; overflow: hidden; position: relative; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .slide-scaler .slide { transform: scale(0.37037); }
        .caption-box { width: 400px; margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .caption-text { width: 100%; height: 80px; background: #000; color: #ddd; border: 1px solid #333; border-radius: 6px; padding: 10px; font-size: 12px; font-family: 'Segoe UI', sans-serif; resize: none; line-height: 1.5; }
        .btn-copy { background: #222; color: #bbb; border: 1px solid #444; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: 600; }
        .btn-copy:hover { background: #333; color: #fff; }

        .slide {
            width: 1080px; height: 1350px;
            position: absolute; top: 0; left: 0;
            background: #0B1D3A;
            display: flex; flex-direction: column; justify-content: center;
            padding: 110px 95px;
            font-family: 'Montserrat', sans-serif;
            transform-origin: top left;
            overflow: hidden;
        }
        .slide.bg-light { background: #F0EBE3; }

        .tx-dark {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.08; mix-blend-mode: overlay;
        }
        .tx-light {
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.04; mix-blend-mode: multiply;
        }

        .arrow { position: absolute; bottom: 75px; right: 75px; display: flex; align-items: center; z-index: 10; }
        .arrow-line { width: 110px; height: 2px; background: rgba(255,255,255,0.3); }
        .arrow-head { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 13px solid rgba(255,255,255,0.3); }
        .slide.bg-light .arrow-line { background: rgba(11,29,58,0.3); }
        .slide.bg-light .arrow-head { border-left-color: rgba(11,29,58,0.3); }

        .t-label { font-size: 28px; font-weight: 700; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 4px; }
        .t-large { font-size: 72px; font-weight: 900; color: #fff; line-height: 1.1; letter-spacing: -1.5px; text-transform: uppercase; }
        .t-bold  { font-size: 48px; font-weight: 900; color: #fff; line-height: 1.25; letter-spacing: -0.5px; }
        .t-reg   { font-size: 42px; font-weight: 400; color: rgba(255,255,255,0.82); line-height: 1.55; }
        .t-it    { font-size: 48px; font-style: italic; font-weight: 400; color: rgba(255,255,255,0.75); line-height: 1.4; }

        .slide.bg-light .t-label { color: rgba(11,29,58,0.45); }
        .slide.bg-light .t-large { color: #0B1D3A; }
        .slide.bg-light .t-bold  { color: #0B1D3A; }
        .slide.bg-light .t-reg   { color: rgba(11,29,58,0.8); }

        .hl-gold  { display: inline; background: rgba(234,179,8,0.3); border-radius: 10px; padding: 2px 16px; }
        .hl-light { display: inline; background: rgba(11,29,58,0.1); border-radius: 10px; padding: 2px 16px; }
        .hl-dark  { display: inline; background: rgba(255,255,255,0.12); border-radius: 10px; padding: 2px 16px; }

        .sp    { height: 40px; }
        .sp-sm { height: 20px; }
        .sp-xs { height: 10px; }

        .divider-dashed { width: 100%; border: none; border-top: 2px dashed rgba(255,255,255,0.18); margin: 0; }
        .slide.bg-light .divider-dashed { border-top-color: rgba(11,29,58,0.15); }

        .img-box {
            width: 100%; height: 480px;
            border-radius: 36px;
            background-image: url('REAL_IMG_HERE');
            background-size: cover; background-position: center;
            box-shadow: 0 24px 60px rgba(0,0,0,0.12);
            border: 4px solid rgba(255,255,255,0.35);
            margin-top: 44px; position: relative; z-index: 2;
        }

        /* Coluna comparativa do Salvável */
        .gold-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; }
        .gold-col { background: rgba(11,29,58,0.1); border-radius: 20px; padding: 40px 32px; display: flex; flex-direction: column; gap: 20px; }
        .gold-col-header { font-size: 32px; font-weight: 900; color: #0B1D3A; text-transform: uppercase; letter-spacing: 2px; text-align: center; padding-bottom: 16px; border-bottom: 2px dashed rgba(11,29,58,0.2); }
        .gold-col-header.bad { color: #c0392b; }
        .gold-col-item { font-size: 30px; color: rgba(11,29,58,0.8); line-height: 1.4; }

        #renderArea { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>
    <h1>🧾 Carrossel — Dupla Tributação / Pagar o Plano à Toa</h1>
    <p class="page-subtitle">Q.B.O. — Gustavo Lima | Padrão V4</p>

    <div class="btn-container">
        <button class="btn btn-primary" onclick="downloadAllPNGs()">📦 Baixar TODOS os PNGs</button>
        <button class="btn btn-secondary" onclick="downloadPDF()">📄 Baixar PDF completo</button>
    </div>
    <div class="status" id="status"></div>
    <div class="slides-grid" id="slidesGrid"></div>
    <div id="renderArea"></div>

    <script>
    const SLIDES_HTML = [

        // ── SLIDE 1: CAPA (Empresário entre duas paredes) ─────────────────
        `<div style="position:absolute;inset:0;background-image:url('COVER_B64_HERE');background-size:cover;background-position:center;z-index:1;"></div>
         <div style="position:absolute;bottom:0;left:0;width:100%;height:72%;background:linear-gradient(to top,rgba(11,29,58,1) 0%,rgba(11,29,58,0.95) 30%,rgba(11,29,58,0.6) 65%,transparent 100%);z-index:2;"></div>
         <div style="position:absolute;bottom:0;left:0;width:100%;padding:0 95px 105px;z-index:3;">
             <div class="t-large" style="font-size:74px;line-height:1.0;text-shadow:2px 4px 20px rgba(0,0,0,0.8);">EU SEI QUE VOCÊ<br>QUERIA PARAR<br>DE PAGAR O<br>PLANO DE SAÚDE.</div>
             <div class="sp-sm"></div>
             <div class="t-bold" style="font-size:44px;color:rgba(255,255,255,0.85);font-weight:400;letter-spacing:0;">E faz todo sentido sentir isso.</div>
         </div>`,

        // ── SLIDE 2: VALIDAÇÃO DA RAIVA (Navy + Textura) ──────────────────
        `<div class="tx-dark"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%;">
             <div class="t-label" style="margin-bottom:28px;">A indignação é legítima</div>
             <div class="t-bold" style="font-size:55px;line-height:1.25;">Você paga uma das<br>maiores cargas tributárias<br>do mundo.</div>
             <div class="sp"></div>
             <hr class="divider-dashed"/>
             <div class="sp"></div>
             <div class="t-reg" style="font-size:42px;">Uma parte enorme do que<br>você fatura vai pro governo.<br><br>E parte disso deveria voltar<br>pra você como <span class="hl-gold">saúde pública<br>de qualidade.</span></div>
         </div>`,

        // ── SLIDE 3: A REALIDADE CRUA (Bege + Textura + Img-Box) ──────────
        `<div class="tx-light"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-start;height:100%;padding-top:30px;">
             <div class="t-bold" style="font-size:54px;line-height:1.2;">Só que não volta.</div>
             <div class="sp-sm"></div>
             <div class="t-reg" style="font-size:40px;">Então você se vê obrigado<br>a pagar duas vezes<br>pela mesma coisa.</div>
             <div class="img-box"></div>
         </div>`,

        // ── SLIDE 4: A QUEBRA (Bege + Textura + Sketch) ───────────────────
        `<div style="position:absolute;inset:0;background-image:url('SKETCH_B64_HERE');background-size:cover;background-position:center;mix-blend-mode:darken;filter:brightness(1.05);opacity:0.10;z-index:0;"></div>
         <div class="tx-light"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%;">
             <div class="t-label" style="color:rgba(11,29,58,0.45);margin-bottom:28px;">A questão real</div>
             <div class="t-bold" style="font-size:60px;line-height:1.2;">Essa indignação é justa.<br>Só tem um problema.</div>
             <div class="sp"></div>
             <hr class="divider-dashed" style="border-top-color:rgba(11,29,58,0.15);"/>
             <div class="sp"></div>
             <div class="t-reg" style="font-size:44px;"><span class="hl-light" style="font-weight:900;">Você ainda vai pagar.</span><br><br>A questão é se vai pagar<br>bem pago ou mal pago.</div>
         </div>`,

        // ── SLIDE 5: SALVÁVEL DOURADO ⭐ ───────────────────────────────────
        `<div style="position:absolute;inset:0;background:#EAB308;z-index:0;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%;">
             <div style="font-size:26px;font-weight:700;color:rgba(11,29,58,0.55);text-transform:uppercase;letter-spacing:3px;margin-bottom:28px;text-align:center;">SALVA E COMPARTILHA</div>
             <div class="t-bold" style="font-size:52px;text-align:center;color:#0B1D3A;margin-bottom:36px;">Qual a diferença?</div>

             <div class="gold-compare">
                 <div class="gold-col">
                     <div class="gold-col-header bad">Pago Mal</div>
                     <div class="gold-col-item">Contrato por preço.</div>
                     <div class="gold-col-item">Rede desconhecida.</div>
                     <div class="gold-col-item">Sem análise de reajuste.</div>
                     <div class="gold-col-item">Descobre as limitações na emergência.</div>
                 </div>
                 <div class="gold-col">
                     <div class="gold-col-header" style="color:#1a5c2a;">Pago Bem</div>
                     <div class="gold-col-item">Contrato por análise de risco.</div>
                     <div class="gold-col-item">Rede mapeada e confirmada.</div>
                     <div class="gold-col-item">Reajuste previsível.</div>
                     <div class="gold-col-item">Protegido no momento que importa.</div>
                 </div>
             </div>
         </div>`,

        // ── SLIDE 6: CONCLUSÃO (Navy + Textura) ───────────────────────────
        `<div class="tx-dark"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%;">
             <div class="t-label" style="margin-bottom:28px;">A lógica final</div>
             <div class="t-bold" style="font-size:58px;line-height:1.2;">Se a sua esposa precisar<br>de cirurgia ou o seu filho<br>passar a noite em<br>observação...</div>
             <div class="sp"></div>
             <hr class="divider-dashed"/>
             <div class="sp"></div>
             <div class="t-reg" style="font-size:42px;">Vai ter um hospital bom,<br>um médico de verdade<br>e um <span class="hl-gold">atendimento que<br>não humilha.</span></div>
         </div>`,

        // ── SLIDE 7: CTA (Navy + Textura) ─────────────────────────────────
        `<div class="tx-dark"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%;align-items:center;text-align:center;">
             <div class="t-large" style="font-size:66px;line-height:1.15;">PAGUE. MAS<br>PAGUE CERTO.</div>
             <div class="sp"></div>
             <div class="t-reg" style="font-size:40px;color:rgba(255,255,255,0.68);">Me conta nos comentários:<br>você já sentiu que estava<br>pagando o plano à toa?</div>
             <div class="sp"></div>
             <div style="font-size:52px;font-weight:900;color:#60a5fa;">Segue o perfil pra mais! 🚀💪</div>
         </div>`

    ];

    const LABELS = [
        'Slide 1 — Capa (Dupla Pressão)',
        'Slide 2 — Validação da Raiva',
        'Slide 3 — A Realidade (Img-Box)',
        'Slide 4 — A Quebra de Crença (Sketch)',
        'Slide 5 — Salvável Dourado ⭐',
        'Slide 6 — Conclusão',
        'Slide 7 — CTA'
    ];

    const LEGENDAS = [
        'Se você já ficou com raiva de pagar o plano de saúde, esse post é pra você.',
        'A carga tributária do Brasil é brutal. E parte do que você paga deveria garantir saúde pública de qualidade — e não garante. Então você paga duas vezes.',
        'SUS de um lado. Plano privado do outro. O brasileiro de classe média e o empresário brasileiro vivem nessa armadilha toda a vida.',
        'A indignação faz todo sentido. Mas vai ter que pagar de qualquer jeito — a questão é escolher como.',
        'Salva esse post. Essa é a diferença entre quem paga o plano bem pago e quem descobre as limitações no pior momento possível.',
        'Isso não é sobre ter ou não ter plano de saúde. É sobre ter a certeza de que, se a sua família precisar, a proteção vai estar de pé.',
        'Já senti na pele a raiva de pagar e não saber se vai funcionar de verdade. É por isso que eu faço o que faço.\n\nComenta aí: você já sentiu que estava pagando o plano à toa?\n\n#planodesaude #cargатributária #empresario #saudeempresarial #jcluz'
    ];

    const LIGHT_SLIDES = [2, 3];

    function createSlideElement(index) {
        const slide = document.createElement('div');
        slide.className = 'slide';
        if (LIGHT_SLIDES.includes(index)) slide.classList.add('bg-light');
        const arrow = (index < 6) ? `<div class="arrow"><div class="arrow-line"></div><div class="arrow-head"></div></div>` : '';
        slide.innerHTML = SLIDES_HTML[index] + arrow;
        return slide;
    }

    function buildPreviews() {
        const grid = document.getElementById('slidesGrid');
        grid.innerHTML = '';
        SLIDES_HTML.forEach((_, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';

            const label = document.createElement('div');
            label.className = 'slide-label';
            label.textContent = LABELS[i];

            const scaler = document.createElement('div');
            scaler.className = 'slide-scaler';
            scaler.appendChild(createSlideElement(i));

            const captionBox = document.createElement('div');
            captionBox.className = 'caption-box';
            const ta = document.createElement('textarea');
            ta.className = 'caption-text';
            ta.value = LEGENDAS[i];
            ta.readOnly = true;
            const copyBtn = document.createElement('button');
            copyBtn.className = 'btn-copy';
            copyBtn.innerText = '📋 Copiar Legenda';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(ta.value);
                copyBtn.innerText = '✅ Copiado!';
                setTimeout(() => copyBtn.innerText = '📋 Copiar Legenda', 2000);
            };
            captionBox.appendChild(ta);
            captionBox.appendChild(copyBtn);

            wrapper.appendChild(label);
            wrapper.appendChild(scaler);
            wrapper.appendChild(captionBox);
            grid.appendChild(wrapper);
        });
    }

    async function downloadAllPNGs() {
        document.getElementById('status').innerText = 'Gerando PNGs...';
        const zip = new JSZip();
        for (let i = 0; i < SLIDES_HTML.length; i++) {
            const tmp = document.createElement('div');
            tmp.style.cssText = 'width:1080px;height:1350px;position:absolute;top:-9999px;';
            tmp.appendChild(createSlideElement(i));
            document.body.appendChild(tmp);
            const canvas = await html2canvas(tmp, { scale: 1, useCORS: true, logging: false });
            zip.file(`slide_${i + 1}.png`, canvas.toDataURL('image/png').replace(/^data:image\/png;base64,/, ''), { base64: true });
            document.body.removeChild(tmp);
        }
        zip.generateAsync({ type: 'blob' }).then(content => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = 'carrossel_dupla_tributacao_v4.zip';
            a.click();
            document.getElementById('status').innerText = 'ZIP baixado! ✅';
        });
    }

    async function downloadPDF() {
        document.getElementById('status').innerText = 'Gerando PDF...';
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: [1080, 1350] });
        for (let i = 0; i < SLIDES_HTML.length; i++) {
            const tmp = document.createElement('div');
            tmp.style.cssText = 'width:1080px;height:1350px;position:absolute;top:-9999px;';
            tmp.appendChild(createSlideElement(i));
            document.body.appendChild(tmp);
            const canvas = await html2canvas(tmp, { scale: 1, useCORS: true, logging: false });
            if (i > 0) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 1080, 1350);
            document.body.removeChild(tmp);
        }
        pdf.save('carrossel_dupla_tributacao_v4.pdf');
        document.getElementById('status').innerText = 'PDF baixado! ✅';
    }

    const zipScript = document.createElement('script');
    zipScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    zipScript.onload = buildPreviews;
    document.head.appendChild(zipScript);
    </script>
</body>
</html>
