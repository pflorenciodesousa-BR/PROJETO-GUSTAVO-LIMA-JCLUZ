<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT — O que está dentro da caixa? — Gustavo Lima</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 30px 20px; }
        h1 { text-align: center; font-size: 22px; color: #fff; margin-bottom: 6px; }
        .page-subtitle { text-align: center; color: #777; font-size: 13px; margin-bottom: 30px; }
        .btn-container { text-align: center; margin: 0 0 30px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { border: none; padding: 14px 36px; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-family: 'Montserrat', sans-serif; }
        .btn-primary { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
        .btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #444; }
        .btn-secondary:hover { background: #3a3a3a; color: #fff; }
        .status { text-align: center; color: #3b82f6; margin: 10px 0 20px; font-size: 13px; font-weight: bold; min-height: 20px; }
        .slides-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; max-width: 1400px; margin: 0 auto; }
        .slide-wrapper { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 2px solid #2a2a2a; transition: all 0.2s; display: flex; flex-direction: column; }
        .slide-wrapper:hover { border-color: #3b82f6; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .slide-scaler { width: 100%; aspect-ratio: 1080 / 1350; overflow: hidden; position: relative; }
        .slide-label { padding: 8px 10px 4px; font-size: 12px; color: #777; text-align: center; background: #151515; font-weight: bold; }
        .slide-footer { display: flex; justify-content: center; padding: 6px 10px 10px; background: #151515; }
        .btn-download { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: white; border: none; padding: 8px 20px; font-size: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-family: 'Montserrat', sans-serif; width: 100%; }
        .btn-download:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .btn-download:disabled { opacity: 0.5; cursor: wait; }
        .legenda-box { background: #111; padding: 12px; border-top: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 8px; }
        .legenda-textarea { width: 100%; height: 110px; background: #000; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 10px; font-size: 12px; font-family: 'Segoe UI', sans-serif; resize: vertical; line-height: 1.5; }
        .legenda-textarea:focus { outline: none; border-color: #3b82f6; }
        .btn-copy-legenda { background: #222; color: #bbb; border: 1px solid #444; padding: 8px; font-size: 11px; cursor: pointer; border-radius: 4px; width: 100%; font-weight: 600; transition: all 0.2s; }
        .btn-copy-legenda:hover { background: #333; color: #fff; border-color: #555; }

        /* ===================== ESTILOS DOS SLIDES ===================== */
        .slide {
            width: 1080px; height: 1350px;
            background: linear-gradient(160deg, #0B1D3A 0%, #0F2444 30%, #0A1A35 55%, #0D2040 80%, #091830 100%);
            display: flex; flex-direction: column; justify-content: center;
            padding: 110px 95px; position: relative;
            font-family: 'Montserrat', sans-serif; transform-origin: top left;
            overflow: hidden;
        }
        .slide.bg-light { background: #F0EBE3; color: #0B1D3A; }

        .slide .arrow { position: absolute; bottom: 75px; right: 75px; display: flex; align-items: center; z-index: 10; }
        .slide .arrow-line { width: 110px; height: 2px; background: rgba(255,255,255,0.3); }
        .slide .arrow-head { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 13px solid rgba(255,255,255,0.3); }
        .slide.bg-light .arrow-line { background: rgba(11,29,58,0.3); }
        .slide.bg-light .arrow-head { border-left-color: rgba(11,29,58,0.3); }

        .t-reg   { font-size: 44px; font-weight: 400; color: rgba(255,255,255,0.85); line-height: 1.5; }
        .t-bold  { font-size: 44px; font-weight: 900; color: #ffffff; line-height: 1.35; letter-spacing: -0.5px; }
        .t-large { font-size: 66px; font-weight: 900; color: #ffffff; line-height: 1.15; letter-spacing: -1px; text-transform: uppercase; }
        .t-small { font-size: 36px; font-weight: 400; color: rgba(255,255,255,0.5); line-height: 1.5; }
        .t-accent { font-weight: 900; color: #60a5fa; }

        .slide.bg-light .t-reg   { color: rgba(11,29,58,0.85); }
        .slide.bg-light .t-bold  { color: #0B1D3A; }
        .slide.bg-light .t-large { color: #0B1D3A; }
        .slide.bg-light .t-small { color: rgba(11,29,58,0.5); }

        .hl-gold { background: rgba(234,179,8,0.28); color: #fff !important; padding: 5px 18px; border-radius: 8px; display: inline-block; }
        .hl      { background: rgba(11,29,58,0.14); color: #0B1D3A !important; padding: 5px 18px; border-radius: 8px; display: inline-block; }

        .sp    { height: 36px; }
        .sp-sm { height: 18px; }
        .sp-xs { height: 8px; }

        /* Checklist slide 6 */
        .check-item { display: flex; align-items: flex-start; gap: 24px; padding: 20px 0; border-bottom: 1px solid rgba(11,29,58,0.08); }
        .check-item:last-child { border-bottom: none; }
        .check-box-sq { width: 40px; height: 40px; border: 2.5px solid rgba(11,29,58,0.35); border-radius: 6px; flex-shrink: 0; margin-top: 4px; }

        /* Slide 5 — CPT vs Agravo cards */
        .opcao-card { border-radius: 18px; padding: 36px 32px; flex: 1; }

        /* Slide 3 — Lista o que NÃO muda / muda */
        .cobre-item { display: flex; align-items: flex-start; gap: 22px; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .cobre-item:last-child { border-bottom: none; }

        #renderArea { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
    </style>
</head>
<body>
    <h1>📋 Carrossel — CPT: O que está dentro da caixa?</h1>
    <p class="page-subtitle">Framework Q.B.O. — Gustavo Lima (JCLUZ) | Legendas Individuais Ativadas</p>

    <div class="btn-container">
        <button class="btn btn-primary" onclick="downloadAllPNGs()">📦 Baixar TODOS os PNGs</button>
        <button class="btn btn-secondary" onclick="downloadPDF()">📄 Baixar PDF completo</button>
    </div>
    <div class="status" id="status"></div>
    <div class="slides-grid" id="slidesGrid"></div>
    <div id="renderArea"></div>

    <script>
    const SLIDES_HTML = [

        // SLIDE 1 — Capa / Gancho (ESCURO + Foto)
        `<div style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:url('COVER_B64_HERE');background-size:cover;background-position:center;z-index:1;"></div>
         <div style="position:absolute;top:0;left:0;width:100%;height:65%;background:linear-gradient(to bottom,rgba(11,29,58,1) 0%,rgba(11,29,58,0.92) 25%,rgba(11,29,58,0.55) 55%,rgba(11,29,58,0) 100%);z-index:2;"></div>
         <div style="position:absolute;top:0;left:0;width:100%;padding:50px 95px 0;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;">
             <div class="t-large" style="font-size:74px;text-shadow:2px 2px 12px rgba(0,0,0,0.9);">VOCÊ DECLAROU<br>UMA DOENÇA<br>PRÉ-EXISTENTE.</div>
             <div class="sp-sm"></div>
             <div class="t-bold hl-gold" style="font-size:46px;">E o plano te deu CPT.</div>
             <div class="sp-sm"></div>
             <div class="t-reg" style="font-size:36px;color:rgba(255,255,255,0.72);">Você sabe o que está dentro dessa caixa?</div>
         </div>`,

        // SLIDE 2 — O que é Doença Pré-Existente (BEGE + Sketch formulário)
        `<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:#F0EBE3;z-index:-1;"></div>
         <div style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:url('SKETCH2_B64_HERE');background-size:cover;mix-blend-mode:darken;opacity:0.2;z-index:0;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;">
             <div class="t-bold" style="color:#0B1D3A;font-size:50px;text-transform:uppercase;letter-spacing:-1px;">Primeiro:<br>o que é doença<br>pré-existente?</div>
             <div class="sp"></div>
             <div class="t-reg" style="color:rgba(11,29,58,0.8);font-size:40px;line-height:1.55;">É qualquer condição de saúde<br>que você <strong>já tinha</strong> antes<br>de assinar o plano.</div>
             <div class="sp-sm"></div>
             <div style="background:rgba(11,29,58,0.06);border-left:6px solid #0B1D3A;border-radius:0 12px 12px 0;padding:22px 30px;">
                 <div style="font-size:34px;color:rgba(11,29,58,0.75);line-height:1.7;">Diabetes. Hipertensão.<br>Problemas cardíacos. Hérnia.<br>Depressão. Coluna.</div>
             </div>
             <div class="sp"></div>
             <div class="t-bold hl" style="font-size:36px;">Você é obrigado a declarar.</div>
             <div class="sp-sm"></div>
             <div class="t-reg" style="color:rgba(11,29,58,0.65);font-size:34px;">Omitir é considerado fraude<br>de contrato.</div>
         </div>`,

        // SLIDE 3 — O que é CPT (ESCURO)
        `<div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;">
             <div style="background:rgba(234,179,8,0.15);border:2px solid rgba(234,179,8,0.4);border-radius:16px;padding:16px 48px;margin-bottom:40px;display:inline-block;">
                 <div style="font-size:72px;font-weight:900;color:#EAB308;letter-spacing:4px;">CPT</div>
                 <div style="font-size:30px;font-weight:700;color:rgba(234,179,8,0.8);margin-top:4px;">Cobertura Parcial Temporária</div>
             </div>
             <div class="t-reg" style="font-size:46px;font-weight:700;color:rgba(255,255,255,0.9);">Não é o plano<br>te rejeitando.</div>
             <div class="sp-sm"></div>
             <div class="t-bold" style="font-size:46px;">É o plano te<br>ACEITANDO<br>com uma condição:</div>
             <div class="sp"></div>
             <div class="t-bold hl-gold" style="font-size:40px;line-height:1.5;">Por até 24 meses, procedimentos<br>ligados à sua DPS ficam<br>sem cobertura.</div>
             <div class="sp-sm"></div>
             <div class="t-reg" style="font-size:38px;color:rgba(255,255,255,0.65);">Depois disso? Cobertura total.</div>
         </div>`,

        // SLIDE 4 — O que cobre e o que não cobre (BEGE + Sketch escudo)
        `<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:#F0EBE3;z-index:-1;"></div>
         <div style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:url('SKETCH4_B64_HERE');background-size:cover;mix-blend-mode:darken;opacity:0.18;z-index:0;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;width:100%;">
             <div class="t-bold" style="color:#0B1D3A;font-size:46px;">Na prática, com CPT<br>para hipertensão:</div>
             <div class="sp"></div>
             <div style="width:100%;">
                 <div class="cobre-item" style="border-bottom:1px solid rgba(11,29,58,0.08);">
                     <div style="font-size:40px;flex-shrink:0;">✅</div>
                     <div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:36px;">Consulta com cardiologista</div>
                 </div>
                 <div class="cobre-item" style="border-bottom:1px solid rgba(11,29,58,0.08);">
                     <div style="font-size:40px;flex-shrink:0;">✅</div>
                     <div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:36px;">Exames de sangue e rotina</div>
                 </div>
                 <div class="cobre-item" style="border-bottom:1px solid rgba(11,29,58,0.08);">
                     <div style="font-size:40px;flex-shrink:0;">✅</div>
                     <div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:36px;">Internação por outra causa</div>
                 </div>
                 <div class="cobre-item" style="border-bottom:1px solid rgba(11,29,58,0.08);">
                     <div style="font-size:40px;flex-shrink:0;">❌</div>
                     <div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:36px;">Internação por crise<br>hipertensiva (por até 24 meses)</div>
                 </div>
             </div>
             <div class="sp-sm"></div>
             <div style="background:rgba(11,29,58,0.07);border-left:5px solid #EAB308;border-radius:0 10px 10px 0;padding:18px 24px;width:100%;">
                 <div style="font-size:30px;color:rgba(11,29,58,0.75);line-height:1.5;"><strong>Atenção:</strong> urgência e emergência<br>têm cobertura obrigatória após 24h de internação,<br>mesmo com CPT ativa.</div>
             </div>
         </div>`,

        // SLIDE 5 — CPT vs Agravo (ESCURO)
        `<div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;">
             <div class="t-bold" style="font-size:46px;margin-bottom:10px;">A operadora é obrigada<br>a te oferecer duas opções.</div>
             <div class="t-reg" style="font-size:38px;color:rgba(255,255,255,0.6);margin-bottom:40px;">Mas quase nunca conta isso:</div>
             <div style="display:flex;gap:24px;width:100%;">
                 <div class="opcao-card" style="background:rgba(96,165,250,0.1);border:2px solid rgba(96,165,250,0.35);">
                     <div style="font-size:40px;font-weight:900;color:#60a5fa;margin-bottom:16px;">CPT</div>
                     <div style="font-size:32px;color:rgba(255,255,255,0.8);line-height:1.55;">Preço normal<br>+ exclusão temporária da DPS<br>(até 24 meses)</div>
                 </div>
                 <div class="opcao-card" style="background:rgba(234,179,8,0.1);border:2px solid rgba(234,179,8,0.35);">
                     <div style="font-size:40px;font-weight:900;color:#EAB308;margin-bottom:16px;">AGRAVO</div>
                     <div style="font-size:32px;color:rgba(255,255,255,0.8);line-height:1.55;">Paga um % a mais<br>+ cobertura imediata<br>para a DPS</div>
                 </div>
             </div>
             <div class="sp"></div>
             <div class="t-bold hl-gold" style="font-size:44px;">Você tem direito de ESCOLHER.</div>
         </div>`,

        // SLIDE 6 — Salvável: Checklist (BEGE + Sketch prancheta)
        `<div style="position:absolute;top:0;left:0;width:100%;height:100%;background:#F0EBE3;z-index:-1;"></div>
         <div style="position:absolute;top:0;left:0;width:100%;height:100%;background-image:url('SKETCH6_B64_HERE');background-size:cover;mix-blend-mode:darken;opacity:0.15;z-index:0;"></div>
         <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;width:100%;">
             <div class="t-bold" style="color:#0B1D3A;font-size:48px;text-transform:uppercase;">Antes de assinar<br>com CPT, pergunte:</div>
             <div class="sp-sm"></div>
             <div style="width:100%;">
                 <div class="check-item"><div class="check-box-sq"></div><div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:34px;">Quais condições foram declaradas como DPS?</div></div>
                 <div class="check-item"><div class="check-box-sq"></div><div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:34px;">Quais procedimentos estão excluídos?</div></div>
                 <div class="check-item"><div class="check-box-sq"></div><div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:34px;">Qual é o prazo exato de exclusão?</div></div>
                 <div class="check-item"><div class="check-box-sq"></div><div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:34px;">A operadora me ofereceu a opção de Agravo?</div></div>
                 <div class="check-item"><div class="check-box-sq"></div><div class="t-reg" style="color:rgba(11,29,58,0.85);font-size:34px;">O custo do Agravo vale pelo risco real da minha DPS?</div></div>
             </div>
             <div class="sp-sm"></div>
             <div class="t-bold hl" style="font-size:36px;">Salva isso.</div>
         </div>`,

        // SLIDE 7 — CTA Compartilhamento (ESCURO)
        `<div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;height:100%;justify-content:center;">
             <div class="t-large" style="font-size:68px;line-height:1.12;">CPT NO CONTRATO<br>NÃO É PUNIÇÃO.</div>
             <div class="sp-sm"></div>
             <div class="t-bold hl-gold" style="font-size:44px;">É processo.</div>
             <div class="sp"></div>
             <div class="t-reg" style="font-size:38px;color:rgba(255,255,255,0.72);">Mas entender o que você assinou<br>muda tudo numa internação.</div>
             <div class="sp-sm"></div>
             <div class="t-reg" style="font-size:36px;color:rgba(255,255,255,0.55);">Manda esse carrossel pra quem<br>está contratando ou renovando<br>plano de saúde agora.</div>
             <div class="sp"></div>
             <div class="t-bold t-accent" style="font-size:52px;">Bora, pra cima! 🚀💪</div>
         </div>`
    ];

    const LABELS = [
        'Slide 1 — Gancho / Capa',
        'Slide 2 — O que é Doença Pré-Existente (DPS)',
        'Slide 3 — O que é CPT',
        'Slide 4 — O que Cobre e o que Não Cobre',
        'Slide 5 — CPT vs Agravo (O Segredo)',
        'Slide 6 — Slide Salvável (Checklist)',
        'Slide 7 — CTA Compartilhamento'
    ];

    const LEGENDAS = [
        'Essa caixinha de presente que o plano te entregou pode pesar muito numa internação. Antes de abrir, entenda o que está dentro.',
        'DPS: Doença ou Lesão Pré-Existente. Você é obrigado a declarar qualquer condição que já tinha antes de assinar. Omitir não é estratégia — é fraude de contrato.',
        'CPT não é rejeição. É o plano aceitando você com uma condição: por até 24 meses, a cobertura dos procedimentos ligados à sua doença declarada fica suspensa. Depois disso, cobertura total.',
        'Na prática: consultas, exames e internações por outras causas estão cobertos normalmente. O que fica de fora são os procedimentos diretamente relacionados à condição declarada, pelo período da CPT.',
        'Isso a operadora raramente explica: você tem o direito de escolher entre CPT (preço normal + exclusão temporária) ou Agravo (paga a mais + cobertura imediata). Exija as duas opções antes de assinar.',
        'Salva esse slide antes de contratar ou renovar qualquer plano com DPS. Cinco perguntas que podem te salvar de uma surpresa na hora mais errada.',
        'Manda esse carrossel pra quem está contratando ou renovando plano de saúde agora. Pode fazer diferença no momento que mais importar.\n\nBora, pra cima! 🚀💪\n\n#planodesaude #cpt #cnpj #corretordeseguros #gustavojcluz #planodesaudecnpj #planoempresarial #doencapreexistente'
    ];

    const LIGHT_SLIDES = [1, 3, 5]; // 0-based: slides 2, 4 e 6 (bege)

    function createSlideElement(index) {
        const slide = document.createElement('div');
        slide.className = 'slide';
        if (LIGHT_SLIDES.includes(index)) slide.classList.add('bg-light');
        const arrowHTML = (index < 6) ? '<div class="arrow"><div class="arrow-line"></div><div class="arrow-head"></div></div>' : '';
        slide.innerHTML = SLIDES_HTML[index] + arrowHTML;
        return slide;
    }

    function buildPreviews() {
        const grid = document.getElementById('slidesGrid');
        grid.innerHTML = '';
        SLIDES_HTML.forEach((_, i) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'slide-wrapper';
            const label = document.createElement('div');
            label.className = 'slide-label';
            label.textContent = LABELS[i];
            const scaler = document.createElement('div');
            scaler.className = 'slide-scaler';
            const slide = createSlideElement(i);
            scaler.appendChild(slide);
            const footer = document.createElement('div');
            footer.className = 'slide-footer';
            const btnDl = document.createElement('button');
            btnDl.className = 'btn-download';
            btnDl.textContent = `📥 Baixar Slide ${i + 1}`;
            btnDl.onclick = () => downloadSinglePNG(i, btnDl);
            footer.appendChild(btnDl);
            const legendaBox = document.createElement('div');
            legendaBox.className = 'legenda-box';
            legendaBox.innerHTML = `
                <textarea class="legenda-textarea" id="leg_slide_${i}">${LEGENDAS[i]}</textarea>
                <button class="btn-copy-legenda" id="btn_leg_${i}" onclick="copySlideLeg(${i})">📋 Copiar legenda (Slide ${i + 1})</button>
            `;
            wrapper.appendChild(label);
            wrapper.appendChild(scaler);
            wrapper.appendChild(footer);
            wrapper.appendChild(legendaBox);
            grid.appendChild(wrapper);
            requestAnimationFrame(() => {
                slide.style.transform = `scale(${scaler.offsetWidth / 1080})`;
                slide.style.transformOrigin = 'top left';
            });
        });
    }

    function copySlideLeg(index) {
        const text = document.getElementById(`leg_slide_${index}`).value;
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById(`btn_leg_${index}`);
            btn.textContent = '✅ Copiado!';
            btn.style.background = '#059669'; btn.style.color = '#fff';
            setTimeout(() => { btn.textContent = `📋 Copiar legenda (Slide ${index + 1})`; btn.style.background = '#222'; btn.style.color = '#bbb'; }, 2000);
        });
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    async function renderSlide(index) {
        const area = document.getElementById('renderArea');
        const slide = createSlideElement(index);
        area.appendChild(slide);
        area.style.zIndex = '9999'; area.style.opacity = '1';
        slide.style.transform = 'none';
        await new Promise(r => setTimeout(r, 500));
        const bgColor = LIGHT_SLIDES.includes(index) ? '#F0EBE3' : '#0B1D3A';
        const canvas = await html2canvas(slide, { width: 1080, height: 1350, scale: 1, useCORS: true, backgroundColor: bgColor, logging: false });
        area.removeChild(slide); area.style.zIndex = '-1';
        return canvas;
    }

    async function downloadSinglePNG(index, btn) {
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = '⏳ Gerando...';
        try {
            const canvas = await renderSlide(index);
            const link = document.createElement('a');
            link.download = `CPT_Slide_${index + 1}.png`;
            link.href = canvas.toDataURL('image/png'); link.click();
            btn.textContent = '✅ Baixado!';
            setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
        } catch (e) { btn.textContent = '❌ Erro'; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000); }
    }

    async function downloadAllPNGs() {
        setStatus('Gerando todos os PNGs — aguarde...');
        try {
            for (let i = 0; i < SLIDES_HTML.length; i++) {
                setStatus(`Baixando slide ${i + 1} de ${SLIDES_HTML.length}...`);
                const canvas = await renderSlide(i);
                const link = document.createElement('a');
                link.download = `CPT_Slide_${i + 1}.png`;
                link.href = canvas.toDataURL('image/png'); link.click();
                await new Promise(r => setTimeout(r, 900));
            }
            setStatus('✅ Todas as imagens baixadas com sucesso!');
        } catch (e) { setStatus('❌ Erro: ' + e.message); console.error(e); }
    }

    async function downloadPDF() {
        setStatus('Gerando PDF — aguarde...');
        try {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [108, 135] });
            for (let i = 0; i < SLIDES_HTML.length; i++) {
                setStatus(`Renderizando slide ${i + 1} de ${SLIDES_HTML.length}...`);
                const canvas = await renderSlide(i);
                const imgData = canvas.toDataURL('image/png');
                if (i > 0) pdf.addPage([108, 135]);
                pdf.addImage(imgData, 'PNG', 0, 0, 108, 135);
            }
            pdf.save('CPT_Carrossel_GustavoLima.pdf');
            setStatus('✅ PDF baixado com sucesso!');
        } catch (e) { setStatus('❌ Erro: ' + e.message); console.error(e); }
    }

    document.fonts.ready.then(() => setTimeout(buildPreviews, 300));
    window.addEventListener('resize', () => {
        document.querySelectorAll('.slide-scaler').forEach(scaler => {
            const slide = scaler.querySelector('.slide');
            if (slide) slide.style.transform = `scale(${scaler.offsetWidth / 1080})`;
        });
    });
    </script>
</body>
</html>
